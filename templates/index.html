<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>枫叶炒股 - 模拟交易系统</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}
.header{background:#161b22;border-bottom:1px solid #30363d;padding:10px 20px;display:flex;align-items:center;justify-content:space-between}
.header .logo{font-size:22px;font-weight:bold;color:#ff6b35;display:flex;align-items:center;gap:8px}
.header .logo span{font-size:14px;color:#8b949e;font-weight:normal}
.header .user-info{display:flex;align-items:center;gap:15px}
.header .balance{background:#1a2332;border:1px solid #30363d;border-radius:6px;padding:6px 14px;font-size:15px}
.header .balance .label{color:#8b949e;font-size:11px}
.header .balance .value{color:#3fb950;font-weight:bold;font-size:18px}
.container{display:flex;height:calc(100vh - 56px)}
.sidebar{width:280px;background:#161b22;border-right:1px solid #30363d;overflow-y:auto}
.sidebar h3{padding:14px 16px 8px;color:#ff6b35;font-size:14px;border-bottom:1px solid #30363d}
.stock-item{display:flex;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #21262d;cursor:pointer;transition:all .2s}
.stock-item:hover{background:#1c2129}
.stock-item.active{background:#1a2332;border-left:3px solid #ff6b35}
.stock-item .s-name{font-size:14px;font-weight:500}
.stock-item .s-code{font-size:11px;color:#8b949e}
.stock-item .s-price{text-align:right}
.stock-item .s-price .p{font-size:15px;font-weight:bold}
.stock-item .s-price .c{font-size:11px}
.up{color:#e15241}.down{color:#3fb950}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.chart-area{flex:1;position:relative}
.chart-area .stock-title{padding:12px 20px;font-size:18px;font-weight:bold;display:flex;align-items:center;gap:10px}
.chart-area .stock-title .price{font-size:24px}
.chart-area .stock-title .chg{font-size:14px;margin-left:5px}
#kline-chart{width:100%;height:calc(100% - 50px)}
.trade-panel{width:320px;background:#161b22;border-left:1px solid #30363d;overflow-y:auto;padding:16px}
.trade-panel h3{color:#ff6b35;font-size:15px;margin-bottom:12px}
.trade-panel .info-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid #21262d}
.trade-panel .info-row .v{font-weight:bold}
.trade-tabs{display:flex;gap:0;margin:12px 0}
.trade-tabs button{flex:1;padding:8px;border:1px solid #30363d;background:#0d1117;color:#c9d1d9;cursor:pointer;font-size:14px}
.trade-tabs button:first-child{border-radius:6px 0 0 6px}
.trade-tabs button:last-child{border-radius:0 6px 6px 0}
.trade-tabs button.active{background:#ff6b35;color:#fff;border-color:#ff6b35}
.trade-form{margin-top:12px}
.trade-form label{display:block;font-size:12px;color:#8b949e;margin-bottom:4px}
.trade-form input{width:100%;padding:10px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:16px;margin-bottom:10px}
.trade-form .calc{font-size:12px;color:#8b949e;margin-bottom:10px}
.trade-form .btn{width:100%;padding:12px;border:none;border-radius:6px;font-size:16px;font-weight:bold;cursor:pointer;transition:all .2s}
.trade-form .btn.buy{background:#e15241;color:#fff}
.trade-form .btn.buy:hover{background:#c94032}
.trade-form .btn.sell{background:#3fb950;color:#fff}
.trade-form .btn.sell:hover{background:#2ea043}
.trade-form .btn:disabled{opacity:.5;cursor:not-allowed}
.portfolio{margin-top:16px}
.portfolio h4{color:#ff6b35;font-size:13px;margin-bottom:8px}
.portfolio .pos-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #21262d;font-size:12px}
.portfolio .pos-item .pn{font-weight:bold}
.msg{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:8px;font-size:14px;z-index:1000;animation:slideIn .3s}
@keyframes slideIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}
.msg.success{background:#1a4332;border:1px solid #3fb950;color:#3fb950}
.msg.error{background:#3d1f1a;border:1px solid #e15241;color:#e15241}
.overview{display:flex;gap:12px;padding:12px 20px;border-bottom:1px solid #21262d}
.overview .card{flex:1;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;text-align:center}
.overview .card .lbl{font-size:11px;color:#8b949e}
.overview .card .val{font-size:20px;font-weight:bold;margin-top:4px}
.kline-toolbar{display:flex;gap:6px;padding:8px 20px}
.kline-toolbar button{padding:4px 12px;background:#21262d;border:1px solid #30363d;border-radius:4px;color:#8b949e;cursor:pointer;font-size:12px}
.kline-toolbar button.active{background:#ff6b35;color:#fff;border-color:#ff6b35}
.reset-btn{padding:6px 12px;background:transparent;border:1px solid #30363d;border-radius:4px;color:#8b949e;cursor:pointer;font-size:12px}
.reset-btn:hover{border-color:#e15241;color:#e15241}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    🍁 枫叶炒股
    <span>MapleStock Simulator</span>
  </div>
  <div class="user-info">
    <button class="reset-btn" onclick="resetAccount()">🔄 重置账户</button>
    <div class="balance">
      <div class="label">💰 可用资金</div>
      <div class="value" id="balance">¥900.00</div>
    </div>
  </div>
</div>

<div class="container">
  <!-- 左侧股票列表 -->
  <div class="sidebar" id="stock-list"></div>

  <!-- 主区域 -->
  <div class="main">
    <div class="overview" id="overview-cards">
      <div class="card"><div class="lbl">总资产</div><div class="val" id="total-value" style="color:#58a6ff">¥900.00</div></div>
      <div class="card"><div class="lbl">总盈亏</div><div class="val" id="total-profit">¥0.00</div></div>
      <div class="card"><div class="lbl">盈亏率</div><div class="val" id="total-profit-pct">0.00%</div></div>
      <div class="card"><div class="lbl">持仓市值</div><div class="val" id="market-value" style="color:#ff6b35">¥0.00</div></div>
    </div>

    <div class="chart-area">
      <div class="stock-title" id="stock-title">
        <span id="title-name">贵州茅台</span>
        <span id="title-code" style="color:#8b949e;font-size:13px">600519</span>
        <span class="price" id="title-price">1680.00</span>
        <span class="chg up" id="title-change">+0.00 (+0.00%)</span>
      </div>
      <div class="kline-toolbar" id="kline-toolbar">
        <button onclick="setKlineDays(30)" class="active">1月</button>
        <button onclick="setKlineDays(60)">2月</button>
        <button onclick="setKlineDays(90)">3月</button>
        <button onclick="setKlineDays(200)">全部</button>
      </div>
      <div id="kline-chart"></div>
    </div>
  </div>

  <!-- 右侧交易面板 -->
  <div class="trade-panel" id="trade-panel">
    <h3>📊 <span id="trade-stock-name">贵州茅台</span></h3>
    <div class="info-row"><span>最新价</span><span class="v" id="trade-price">1680.00</span></div>
    <div class="info-row"><span>涨跌</span><span class="v up" id="trade-change">+0.00 (+0.00%)</span></div>
    <div class="info-row"><span>可用资金</span><span class="v" id="trade-balance">¥900.00</span></div>
    <div class="info-row"><span>可买(股)</span><span class="v" id="trade-max-buy">0</span></div>
    <div class="info-row"><span>持仓</span><span class="v" id="trade-hold">0 股</span></div>

    <div class="trade-tabs">
      <button class="active" onclick="setTradeAction('buy')">买入</button>
      <button onclick="setTradeAction('sell')">卖出</button>
    </div>

    <div class="trade-form">
      <label>交易股数</label>
      <input type="number" id="trade-shares" value="10" min="1" step="1" oninput="updateTradeCalc()">
      <div class="calc" id="trade-calc">预计: ¥0.00</div>
      <button class="btn buy" id="trade-btn" onclick="executeTrade()">买入</button>
    </div>

    <div class="portfolio">
      <h4>📋 持仓明细</h4>
      <div id="portfolio-list"></div>
    </div>
  </div>
</div>

<div id="message" class="msg" style="display:none"></div>

<script>
// ============ 全局状态 ============
let currentStock = '600519';
let currentAction = 'buy';
let klineDays = 30;
let stocksData = {};
let klineChart = null;
let balance = 900;
let holdings = {};
let refreshTimer = null;

// ============ 初始化 ============
async function init() {
  await fetch('/api/init', {method:'POST'});
  await refreshAll();
  refreshTimer = setInterval(refreshAll, 5000);
}

// ============ 刷新所有数据 ============
async function refreshAll() {
  try {
    const [stocksRes, portfolioRes] = await Promise.all([
      fetch('/api/stocks'),
      fetch('/api/portfolio')
    ]);
    stocksData = {};
    const stocks = await stocksRes.json();
    stocks.forEach(s => { stocksData[s.code] = s; });

    const pf = await portfolioRes.json();
    balance = pf.balance;
    holdings = {};
    pf.holdings.forEach(h => { holdings[h.code] = h; });

    renderStockList();
    updateStockTitle();
    updateTradePanel();
    updateOverview(pf);
    updatePortfolio();
    await loadKline();
  } catch(e) {
    console.error('Refresh error:', e);
  }
}

// ============ 渲染股票列表 ============
function renderStockList() {
  const list = document.getElementById('stock-list');
  list.innerHTML = '<h3>📈 股票列表</h3>';
  for (const [code, s] of Object.entries(stocksData)) {
    const cls = s.change_pct >= 0 ? 'up' : 'down';
    const sign = s.change_pct >= 0 ? '+' : '';
    const active = code === currentStock ? ' active' : '';
    list.innerHTML += `
      <div class="stock-item${active}" onclick="selectStock('${code}')">
        <div>
          <div class="s-name">${s.name}</div>
          <div class="s-code">${code}</div>
        </div>
        <div class="s-price">
          <div class="p">${s.price.toFixed(2)}</div>
          <div class="c ${cls}">${sign}${s.change.toFixed(2)} (${sign}${s.change_pct.toFixed(2)}%)</div>
        </div>
      </div>`;
  }
}

// ============ 选择股票 ============
function selectStock(code) {
  currentStock = code;
  renderStockList();
  updateStockTitle();
  updateTradePanel();
  loadKline();
}

// ============ 更新股票标题 ============
function updateStockTitle() {
  const s = stocksData[currentStock];
  if (!s) return;
  document.getElementById('title-name').textContent = s.name;
  document.getElementById('title-code').textContent = currentStock;
  document.getElementById('title-price').textContent = s.price.toFixed(2);
  const cls = s.change_pct >= 0 ? 'up' : 'down';
  const sign = s.change_pct >= 0 ? '+' : '';
  document.getElementById('title-change').className = 'chg ' + cls;
  document.getElementById('title-change').textContent = `${sign}${s.change.toFixed(2)} (${sign}${s.change_pct.toFixed(2)}%)`;
  document.getElementById('trade-stock-name').textContent = s.name;
}

// ============ 更新交易面板 ============
function updateTradePanel() {
  const s = stocksData[currentStock];
  if (!s) return;
  document.getElementById('trade-price').textContent = s.price.toFixed(2);
  const cls = s.change_pct >= 0 ? 'up' : 'down';
  const sign = s.change_pct >= 0 ? '+' : '';
  document.getElementById('trade-change').className = 'v ' + cls;
  document.getElementById('trade-change').textContent = `${sign}${s.change.toFixed(2)} (${sign}${s.change_pct.toFixed(2)}%)`;
  document.getElementById('trade-balance').textContent = '¥' + balance.toFixed(2);
  document.getElementById('trade-max-buy').textContent = Math.floor(balance / s.price);
  const hold = holdings[currentStock];
  document.getElementById('trade-hold').textContent = (hold ? hold.shares : 0) + ' 股';
  updateTradeCalc();
}

// ============ 更新总览 ============
function updateOverview(pf) {
  document.getElementById('balance').textContent = '¥' + pf.balance.toFixed(2);
  document.getElementById('total-value').textContent = '¥' + pf.total_value.toFixed(2);
  const cls = pf.total_profit >= 0 ? 'up' : 'down';
  const sign = pf.total_profit >= 0 ? '+' : '';
  document.getElementById('total-profit').className = 'val ' + cls;
  document.getElementById('total-profit').textContent = sign + '¥' + pf.total_profit.toFixed(2);
  document.getElementById('total-profit-pct').className = 'val ' + cls;
  document.getElementById('total-profit-pct').textContent = sign + pf.total_profit_pct.toFixed(2) + '%';
  let mv = 0;
  pf.holdings.forEach(h => mv += h.market_value);
  document.getElementById('market-value').textContent = '¥' + mv.toFixed(2);
}

// ============ 更新持仓 ============
function updatePortfolio() {
  const list = document.getElementById('portfolio-list');
  const entries = Object.values(holdings);
  if (entries.length === 0) {
    list.innerHTML = '<div style="color:#8b949e;font-size:12px;padding:8px 0">暂无持仓</div>';
    return;
  }
  list.innerHTML = '';
  entries.forEach(h => {
    const cls = h.profit >= 0 ? 'up' : 'down';
    const sign = h.profit >= 0 ? '+' : '';
    list.innerHTML += `
      <div class="pos-item">
        <div>
          <div class="pn">${h.name}</div>
          <div style="color:#8b949e">${h.shares}股 × ¥${h.price.toFixed(2)}</div>
        </div>
        <div style="text-align:right">
          <div class="pn ${cls}">${sign}¥${h.profit.toFixed(2)}</div>
          <div class="${cls}">${sign}${h.profit_pct.toFixed(2)}%</div>
        </div>
      </div>`;
  });
}

// ============ K线图 ============
async function loadKline() {
  try {
    const res = await fetch(`/api/kline/${currentStock}?days=${klineDays}`);
    const data = await res.json();
    renderKline(data);
  } catch(e) { console.error('Kline error:', e); }
}

function renderKline(data) {
  const chartDom = document.getElementById('kline-chart');
  if (!klineChart) {
    klineChart = echarts.init(chartDom, 'dark');
    window.addEventListener('resize', () => klineChart.resize());
  }

  const dates = data.map(d => d.date);
  const ohlc = data.map(d => [d.open, d.close, d.low, d.high]);
  const volumes = data.map(d => d.volume);

  const option = {
    backgroundColor: '#0d1117',
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'cross' },
      backgroundColor: '#161b22',
      borderColor: '#30363d',
      textStyle: { color: '#c9d1d9', fontSize: 12 },
      formatter: function(params) {
        const k = params[0];
        if (!k) return '';
        const d = k.data;
        const chg = ((d[2] - d[1]) / d[1] * 100).toFixed(2);
        const sign = chg >= 0 ? '+' : '';
        const color = chg >= 0 ? '#e15241' : '#3fb950';
        return `<b>${k.axisValue}</b><br/>
          开: <span style="color:${color}">${d[1].toFixed(2)}</span>&nbsp;
          收: <span style="color:${color}">${d[2].toFixed(2)}</span>&nbsp;
          涨跌: <span style="color:${color}">${sign}${chg}%</span><br/>
          高: ${d[4].toFixed(2)}&nbsp;
          低: ${d[3].toFixed(2)}&nbsp;
          量: ${(params[1]?.data / 10000).toFixed(0)}万手`;
      }
    },
    grid: [
      { left: '8%', right: '3%', top: '5%', height: '60%' },
      { left: '8%', right: '3%', top: '72%', height: '20%' }
    ],
    xAxis: [
      { type: 'category', data: dates, gridIndex: 0, axisLine: { lineStyle: { color: '#30363d' } }, axisLabel: { color: '#8b949e', fontSize: 10 } },
      { type: 'category', data: dates, gridIndex: 1, axisLine: { lineStyle: { color: '#30363d' } }, axisLabel: { show: false } }
    ],
    yAxis: [
      { type: 'value', gridIndex: 0, scale: true, splitLine: { lineStyle: { color: '#21262d' } }, axisLabel: { color: '#8b949e', fontSize: 10 } },
      { type: 'value', gridIndex: 1, axisLabel: { color: '#8b949e', fontSize: 9 } }
    ],
    series: [
      {
        name: 'K线',
        type: 'candlestick',
        xAxisIndex: 0,
        yAxisIndex: 0,
        data: ohlc,
        itemStyle: {
          color: '#e15241',
          color0: '#3fb950',
          borderColor: '#e15241',
          borderColor0: '#3fb950'
        },
        markLine: {
          silent: true,
          symbol: 'none',
          data: [
            { yAxis: ohlc[ohlc.length - 1]?.[1], lineStyle: { color: '#ff6b35', type: 'dashed', width: 1 } }
          ],
          label: { show: false }
        }
      },
      {
        name: '成交量',
        type: 'bar',
        xAxisIndex: 1,
        yAxisIndex: 1,
        data: volumes,
        itemStyle: {
          color: function(params) {
            const idx = params.dataIndex;
            if (idx < 1) return '#8b949e';
            return ohlc[idx][2] >= ohlc[idx][1] ? '#e15241' : '#3fb950';
          }
        }
      }
    ]
  };

  klineChart.setOption(option, true);
}

function setKlineDays(days) {
  klineDays = days;
  const btns = document.querySelectorAll('#kline-toolbar button');
  btns.forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  loadKline();
}

// ============ 交易 ============
function setTradeAction(action) {
  currentAction = action;
  const btns = document.querySelectorAll('.trade-tabs button');
  btns.forEach(b => b.classList.remove('active'));
  if (action === 'buy') {
    btns[0].classList.add('active');
    document.getElementById('trade-btn').className = 'btn buy';
    document.getElementById('trade-btn').textContent = '买入';
  } else {
    btns[1].classList.add('active');
    document.getElementById('trade-btn').className = 'btn sell';
    document.getElementById('trade-btn').textContent = '卖出';
  }
  updateTradeCalc();
}

function updateTradeCalc() {
  const s = stocksData[currentStock];
  if (!s) return;
  const shares = parseInt(document.getElementById('trade-shares').value) || 0;
  const amount = shares * s.price;
  const calc = document.getElementById('trade-calc');
  if (currentAction === 'buy') {
    calc.textContent = `预计花费: ¥${amount.toFixed(2)} | 可用: ¥${balance.toFixed(2)}`;
  } else {
    const hold = holdings[currentStock];
    const max = hold ? hold.shares : 0;
    calc.textContent = `预计收入: ¥${amount.toFixed(2)} | 可卖: ${max} 股`;
  }
}

async function executeTrade() {
  const shares = parseInt(document.getElementById('trade-shares').value) || 0;
  if (shares <= 0) {
    showMsg('请输入有效股数', 'error');
    return;
  }

  try {
    const res = await fetch('/api/trade', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        code: currentStock,
        action: currentAction,
        shares: shares
      })
    });

    const data = await res.json();
    if (res.ok) {
      const s = stocksData[currentStock];
      const actionText = currentAction === 'buy' ? '买入' : '卖出';
      showMsg(`✅ ${actionText}成功！${s.name} ${shares}股 @ ¥${s.price.toFixed(2)}`, 'success');
      await refreshAll();
    } else {
      showMsg('❌ ' + data.error, 'error');
    }
  } catch(e) {
    showMsg('❌ 交易失败，请重试', 'error');
  }
}

async function resetAccount() {
  if (!confirm('确定要重置账户吗？所有持仓和余额将恢复初始状态。')) return;
  await fetch('/api/reset', { method: 'POST' });
  await refreshAll();
  showMsg('✅ 账户已重置，余额恢复为 ¥900.00', 'success');
}

function showMsg(text, type) {
  const msg = document.getElementById('message');
  msg.textContent = text;
  msg.className = 'msg ' + type;
  msg.style.display = 'block';
  setTimeout(() => { msg.style.display = 'none'; }, 3000);
}

// 键盘快捷键
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.activeElement === document.getElementById('trade-shares')) {
    executeTrade();
  }
});

// 启动
init();
</script>
</body>
</html>
