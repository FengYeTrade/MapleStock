<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>枫叶炒股</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root{--bg:#0a0f1a;--card:#111827;--bd:#1e2d3d;--tx:#e2e8f0;--sub:#64748b;--acc:#f59e0b;--red:#ef4444;--grn:#10b981;--blu:#3b82f6;--nav-h:60px;--hd-h:48px;--safe:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--tx);height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;transition:background .6s}
.header{height:var(--hd-h);min-height:var(--hd-h);background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:10;flex-shrink:0}
.header .logo{font-size:15px;font-weight:800;background:linear-gradient(135deg,var(--acc),#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;cursor:pointer}
.header .right{display:flex;align-items:center;gap:10px}
.header .timer{font-size:13px;font-weight:700;color:var(--grn);background:rgba(16,185,129,.12);padding:3px 10px;border-radius:12px;min-width:60px;text-align:center;transition:all .3s}
.header .timer.warn{color:var(--acc);background:rgba(245,158,11,.15);animation:pulse .5s infinite}
.header .timer.urgent{color:var(--red);background:rgba(239,68,68,.2);animation:pulse .3s infinite}
@keyframes pulse{50%{opacity:.4;transform:scale(1.05)}}
.header .bal{font-size:13px;font-weight:700;color:var(--grn);transition:color .3s}
.header .user{font-size:11px;color:var(--sub);cursor:pointer;padding:4px 10px;border:1px solid var(--bd);border-radius:14px;transition:all .2s}
.header .user:active{color:var(--acc);border-color:var(--acc)}
.main{flex:1;overflow:hidden;position:relative}
.page{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page.active{display:flex}
.market-wrap{flex:1;display:flex;flex-direction:column;min-height:0}
.stock-scroll{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.stock-scroll::-webkit-scrollbar{display:none}
.stock-chip{flex:0 0 auto;min-width:90px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:center;transition:all .15s;position:relative;overflow:hidden}
.stock-chip:active{transform:scale(.96)}
.stock-chip.selected{border-color:var(--acc);background:#1a1f2e}
.stock-chip .name{font-size:12px;font-weight:600;margin-bottom:2px;position:relative;z-index:1}
.stock-chip .price{font-size:15px;font-weight:700;position:relative;z-index:1;display:inline-block}
.stock-chip .change{font-size:10px;position:relative;z-index:1}
.chart-area{flex:1;min-height:200px;position:relative}
#chart{width:100%;height:100%}
.chart-flash{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;opacity:0;z-index:2;border-radius:8px}
.chart-flash.green{background:rgba(16,185,129,.12);opacity:1;animation:flashOut .5s ease-out forwards}
.chart-flash.red{background:rgba(239,68,68,.2);opacity:1;animation:flashOut .8s ease-out forwards}
@keyframes flashOut{to{opacity:0}}
.range-bar{display:flex;gap:4px;padding:6px 12px 10px;flex-shrink:0}
.range-bar b{padding:5px 16px;background:var(--card);border:1px solid var(--bd);border-radius:16px;color:var(--sub);font-size:11px;cursor:pointer;transition:all .15s}
.range-bar b.active{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}
.up{color:var(--red)}.down{color:var(--grn)}
.trade-pg{padding:14px}
.stock-info{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:12px}
.stock-info .si-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.stock-info .si-name{font-size:17px;font-weight:700}
.stock-info .si-price{font-size:32px;font-weight:800;display:inline-block;transition:color .3s}
@keyframes priceBounce{0%{transform:scale(1)}30%{transform:scale(1.12)}60%{transform:scale(.95)}100%{transform:scale(1)}}
.price-bounce{animation:priceBounce .45s ease-out}
.stock-info .si-change{font-size:12px;margin-left:6px}
.stock-info .si-detail{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)}
.stock-info .si-detail span{color:var(--tx);font-weight:600}
.trade-tabs{display:flex;gap:0;margin-bottom:12px}
.trade-tabs b{flex:1;padding:11px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:14px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s}
.trade-tabs b:first-child{border-radius:10px 0 0 10px}
.trade-tabs b:last-child{border-radius:0 10px 10px 0}
.trade-tabs b.active.buy{background:var(--red);color:#fff;border-color:var(--red)}
.trade-tabs b.active.sell{background:var(--grn);color:#fff;border-color:var(--grn)}
.trade-form{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
.trade-form label{display:block;font-size:12px;color:var(--sub);margin-bottom:8px}
.trade-form .input-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.trade-form .input-row input{flex:1;padding:11px 14px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;color:var(--tx);font-size:16px;outline:none;transition:border-color .2s}
.trade-form .input-row input:focus{border-color:var(--acc)}
.trade-form .quick-btn{padding:5px 10px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;color:var(--sub);font-size:10px;cursor:pointer;white-space:nowrap}
.trade-form .cost-hint{font-size:11px;color:var(--sub);margin-bottom:12px;min-height:16px}
.trade-form .submit-btn{width:100%;padding:13px;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;color:#fff;transition:all .15s}
.trade-form .submit-btn:active{transform:scale(.98);opacity:.85}
.trade-form .submit-btn.buy{background:var(--red)}
.trade-form .submit-btn.sell{background:var(--grn)}
.holdings-pg{padding:14px}
.overview{display:flex;gap:8px;margin-bottom:14px}
.overview .ov-card{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:center}
.overview .ov-card .ov-label{font-size:10px;color:var(--sub);margin-bottom:4px}
.overview .ov-card .ov-value{font-size:17px;font-weight:700}
.holding-item{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.holding-item:active{background:#161e2e}
.holding-item .hi-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.holding-item .hi-name{font-size:14px;font-weight:700}
.holding-item .hi-code{font-size:10px;color:var(--sub)}
.holding-item .hi-profit{font-size:14px;font-weight:700}
.holding-item .hi-detail{display:flex;justify-content:space-between;font-size:11px;color:var(--sub)}
.holding-item .hi-detail span{color:var(--tx)}
.empty-state{text-align:center;padding:50px 20px;color:var(--sub)}
.empty-state .empty-icon{font-size:40px;margin-bottom:10px}
.empty-state .empty-text{font-size:14px}
.reset-btn{display:block;width:100%;margin-top:12px;padding:12px;background:transparent;border:1px solid var(--red);border-radius:10px;color:var(--red);font-size:14px;cursor:pointer;text-align:center;font-weight:600}
.navbar{height:var(--nav-h);min-height:var(--nav-h);background:var(--card);border-top:1px solid var(--bd);display:flex;z-index:10;flex-shrink:0;padding-bottom:var(--safe)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--sub);transition:all .15s;position:relative}
.nav-item:active{opacity:.7}
.nav-item.active{color:var(--acc)}
.nav-item .nav-icon{font-size:22px;line-height:1}
.nav-item .nav-label{font-size:10px;font-weight:500}
.nav-item.active::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:3px;background:var(--acc);border-radius:0 0 3px 3px}
.auth-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(2,6,14,.95);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px}
.auth-overlay.show{display:flex}
.auth-card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:32px 24px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:authIn .35s ease-out}
@keyframes authIn{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.auth-card .auth-title{font-size:24px;font-weight:800;text-align:center;margin-bottom:6px;background:linear-gradient(135deg,var(--acc),#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.auth-card .auth-sub{font-size:13px;color:var(--sub);text-align:center;margin-bottom:24px;line-height:1.5}
.auth-card .auth-fields{display:flex;flex-direction:column;gap:12px}
.auth-card .auth-fields input{width:100%;padding:14px 16px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;color:var(--tx);font-size:16px;outline:none;transition:border-color .2s}
.auth-card .auth-fields input:focus{border-color:var(--acc)}
.auth-card .auth-fields input::placeholder{color:var(--sub);font-size:14px}
.auth-card .captcha-row{display:flex;gap:10px;align-items:center}
.auth-card .captcha-row input{flex:1}
.auth-card .captcha-display{background:linear-gradient(135deg,#1a1f2e,#0f172a);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;font-size:24px;font-weight:900;letter-spacing:4px;color:var(--acc);cursor:pointer;min-width:100px;text-align:center;user-select:none;font-family:'Courier New',monospace;text-decoration:line-through;flex-shrink:0}
.auth-card .auth-btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;color:#000;background:linear-gradient(135deg,var(--acc),#fbbf24);transition:all .15s;margin-top:4px;letter-spacing:2px}
.auth-card .auth-btn:active{transform:scale(.98);opacity:.85}
.auth-card .auth-switch{text-align:center;font-size:13px;color:var(--sub);margin-top:18px;cursor:pointer}
.auth-card .auth-switch span{color:var(--blu);text-decoration:underline;font-weight:600}
.admin-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:10000;display:none;align-items:center;justify-content:center;padding:20px}
.admin-overlay.show{display:flex}
.admin-panel{background:var(--card);border:2px solid var(--acc);border-radius:16px;width:100%;max-width:500px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 0 60px rgba(245,158,11,.2);animation:authIn .3s ease-out}
.admin-panel .ap-header{background:linear-gradient(135deg,#1a0f00,#2d1a00);padding:16px 20px;border-radius:14px 14px 0 0;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--acc)}
.admin-panel .ap-header .ap-title{font-size:16px;font-weight:800;color:var(--acc);letter-spacing:2px}
.admin-panel .ap-header .ap-close{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:var(--tx);font-size:18px;cursor:pointer;line-height:32px;text-align:center}
.admin-panel .ap-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.admin-panel .ap-btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;color:#fff;transition:all .15s}
.admin-panel .ap-btn:active{transform:scale(.98);opacity:.85}
.admin-panel .ap-btn.crash{background:var(--red)}
.admin-panel .ap-btn.warn{background:var(--acc);color:#000}
.admin-panel .ap-btn.danger{background:#7f1d1d;border:1px solid var(--red)}
.admin-panel .ap-btn.normal{background:var(--blu)}
.admin-panel .ap-section{margin-top:8px}
.admin-panel .ap-section .ap-label{font-size:11px;color:var(--sub);margin-bottom:6px;font-weight:600}
.admin-panel .ap-user-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;margin-bottom:4px;gap:8px}
.admin-panel .ap-user-row .ap-uname{font-size:13px;font-weight:600;flex:1}
.admin-panel .ap-user-row .ap-bal{font-size:12px;color:var(--grn);font-weight:600;white-space:nowrap}
.admin-panel .ap-user-row .ap-crash{font-size:10px;padding:4px 8px;border-radius:6px;background:rgba(239,68,68,.15);color:var(--red);white-space:nowrap}
.admin-panel .ap-user-row .ap-small-btn{padding:6px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:none;white-space:nowrap;transition:all .15s}
.admin-panel .ap-user-row .ap-small-btn:active{transform:scale(.95)}
.admin-panel .ap-user-row .ap-small-btn.enter{background:var(--blu);color:#fff}
.admin-panel .ap-user-row .ap-small-btn.del{background:rgba(239,68,68,.15);color:var(--red)}
.admin-indicator{position:fixed;top:8px;right:8px;font-size:10px;color:var(--acc);background:rgba(245,158,11,.15);padding:2px 8px;border-radius:8px;z-index:10001;display:none;pointer-events:none}
.admin-indicator.show{display:block}
.toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:9998;animation:toastIn .3s;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.toast.success{background:#0a2e1a;border:1px solid var(--grn);color:var(--grn)}
.toast.error{background:#2e0a0a;border:1px solid var(--red);color:var(--red)}
.toast.warning{background:#2e1f0a;border:1px solid var(--acc);color:var(--acc)}
.toast.crash{background:#3d0000;border:2px solid var(--red);color:var(--red);font-size:16px;padding:14px 24px;animation:crashShake .5s ease-out}
@keyframes crashShake{0%,100%{transform:translateX(-50%)}10%,50%,90%{transform:translateX(calc(-50% - 6px))}30%,70%{transform:translateX(calc(-50% + 6px))}}
body.crash-phase1{background:#1a0000}
body.crash-phase2{background:#2d0000}
body.crash-phase3{background:#3d0000}
body.crash-phase4{background:var(--bg)}
@keyframes jumpUp{0%{transform:scale(1)}30%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes jumpDown{0%{transform:scale(1)}30%{transform:scale(.82)}100%{transform:scale(1)}}
.jump-up{animation:jumpUp .35s ease-out}
.jump-down{animation:jumpDown .35s ease-out}
@media(min-width:768px){.market-wrap{flex-direction:row}.stock-scroll{flex-direction:column;width:200px;min-width:200px;max-width:200px;border-right:1px solid var(--bd);overflow-y:auto;overflow-x:hidden;padding:8px;gap:4px}.stock-chip{min-width:auto;text-align:left;padding:10px 14px}.chart-area{min-height:380px}.trade-pg,.holdings-pg{max-width:460px;margin:0 auto}}
</style>
</head>
<body>

<div class="auth-overlay" id="auth-overlay"><div class="auth-card" id="auth-card"></div></div>

<div class="header">
  <div class="logo" id="logo-btn">🍁 枫叶炒股</div>
  <div class="right">
    <div class="timer" id="header-timer">⏱ 60s</div>
    <div class="bal" id="header-balance">¥900,000.00</div>
    <div class="user" id="header-user" onclick="doLogout()"></div>
  </div>
</div>

<div class="main">
  <div class="page active" id="page-market">
    <div class="market-wrap">
      <div class="stock-scroll" id="stock-list"></div>
      <div class="chart-area"><div id="chart"></div><div class="chart-flash" id="chart-flash"></div></div>
      <div class="range-bar">
        <b class="active" onclick="setRange(30,this)">1月</b><b onclick="setRange(60,this)">2月</b><b onclick="setRange(90,this)">3月</b><b onclick="setRange(200,this)">全部</b>
      </div>
    </div>
  </div>
  <div class="page" id="page-trade">
    <div class="trade-pg">
      <div class="stock-info" id="stock-info"></div>
      <div class="trade-tabs">
        <b class="active buy" onclick="setAction('buy')">买 入</b><b class="sell" onclick="setAction('sell')">卖 出</b>
      </div>
      <div class="trade-form">
        <label>交易股数</label>
        <div class="input-row">
          <input type="number" id="shares-input" value="10" min="1" oninput="updateCost()">
          <span class="quick-btn" onclick="setShares(1)">1</span><span class="quick-btn" onclick="setShares(10)">10</span><span class="quick-btn" onclick="setShares(100)">100</span><span class="quick-btn" onclick="setShares('max')">最大</span>
        </div>
        <div class="cost-hint" id="cost-hint"></div>
        <div class="submit-btn buy" id="submit-btn" onclick="executeTrade()">买 入</div>
      </div>
    </div>
  </div>
  <div class="page" id="page-holdings">
    <div class="holdings-pg">
      <div class="overview">
        <div class="ov-card"><div class="ov-label">总资产</div><div class="ov-value" style="color:var(--blu)" id="ov-total">¥900,000.00</div></div>
        <div class="ov-card"><div class="ov-label">持仓市值</div><div class="ov-value" style="color:var(--acc)" id="ov-market">¥0.00</div></div>
        <div class="ov-card"><div class="ov-label">总盈亏</div><div class="ov-value" id="ov-pnl">¥0.00</div></div>
      </div>
      <div id="holdings-list"></div>
      <div class="reset-btn" onclick="resetAccount()">🔄 重置账户</div>
    </div>
  </div>
</div>

<div class="navbar">
  <div class="nav-item active" data-page="market" onclick="switchPage('market')"><span class="nav-icon">📈</span><span class="nav-label">行情</span></div>
  <div class="nav-item" data-page="trade" onclick="switchPage('trade')"><span class="nav-icon">💹</span><span class="nav-label">交易</span></div>
  <div class="nav-item" data-page="holdings" onclick="switchPage('holdings')"><span class="nav-icon">📋</span><span class="nav-label">持仓</span></div>
</div>

<div class="toast" id="toast" style="display:none"></div>
<div class="admin-overlay" id="admin-overlay">
  <div class="admin-panel"><div class="ap-header"><span class="ap-title">🕵️ 庄家后台</span><button class="ap-close" onclick="closeAdmin()">✕</button></div><div class="ap-body" id="admin-body"></div></div>
</div>
<div class="admin-indicator" id="admin-indicator">🔑 后门</div>

<script>
const STOCKS={
  '000001':{name:'平安银行',base:12.5},'600519':{name:'贵州茅台',base:1680},'000858':{name:'五粮液',base:156.8},
  '601318':{name:'中国平安',base:45.2},'600036':{name:'招商银行',base:38.6},'300750':{name:'宁德时代',base:210.5},
  '002594':{name:'比亚迪',base:268.3},'688981':{name:'中芯国际',base:52.4},'300059':{name:'东方财富',base:18.9},
  '600276':{name:'恒瑞医药',base:48.7}
};

let state={
  prices:{}, klines:{}, balance:900000, holdings:{}, selected:'600519', range:30, action:'buy',
  currentUser:null, chart:null, timer:60, crashed:false, crashPhase:0, adminMode:false,
  es:null, klineReady:false
};

// ============ 后端API ============
const API=(u,p)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}).then(r=>r.json());

function fmt(n){return n.toFixed(2)}
function fmtMoney(n){let p=n.toFixed(2).split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return p.join('.');}
function pct(a,b){return b===0?0:((a-b)/b*100);}

// ============ SSE 实时连接 ============
function connectSSE(){
  if(state.es)state.es.close();
  state.es=new EventSource('/api/stream');
  state.es.onmessage=function(e){
    let d=JSON.parse(e.data);
    if(d.type==='init'){
      state.prices=d.prices;state.timer=d.timer;state.crashed=d.crashed;state.crashPhase=d.crash_phase;
      updateTimerDisplay();updateAll();loadKlines();
    }else if(d.type==='tick'){
      let oldPrices={...state.prices};
      state.prices=d.prices;
      animateStockPrices(oldPrices);
      state.timer=d.timer;
      updateTimerDisplay();
      if(document.getElementById('page-trade').classList.contains('active'))renderTradeInfo();
      if(document.getElementById('page-holdings').classList.contains('active'))renderHoldings();
      renderChart();
    }else if(d.type==='timer'){
      state.timer=d.timer;updateTimerDisplay();
    }else if(d.type==='crash'){
      state.crashed=true;state.crashPhase=d.phase;
      if(d.prices)state.prices=d.prices;
      let cls='crash-phase'+d.phase;
      document.body.className=cls;
      triggerFlash('red');
      if(d.phase>=2)updateAll();
      if(d.phase===3){
        setTimeout(()=>{document.body.className='crash-phase4';updateAll();},600);
        toast('💥 庄家砸盘！所有股票暴跌99%！','crash');
      }
      updateTimerDisplay();
    }
  };
  state.es.onerror=()=>{setTimeout(connectSSE,2000);};
}

// 加载K线
async function loadKlines(){
  let ps=[];
  for(let code in STOCKS){
    ps.push(fetch('/api/klines/'+code).then(r=>r.json()).then(d=>{if(d.ok)state.klines[code]=d.klines;}));
  }
  await Promise.all(ps);
  state.klineReady=true;
  renderChart();renderStockList();renderTradeInfo();
}

// ============ 价格动画 ============
function animateStockPrices(oldPrices){
  let chips=document.querySelectorAll('.stock-chip'),codes=Object.keys(state.prices);
  chips.forEach((chip,i)=>{
    if(i>=codes.length)return;
    let code=codes[i],price=state.prices[code],oldPrice=oldPrices[code]||price;
    let prev=state.klines[code]&&state.klines[code].length>0?state.klines[code][state.klines[code].length-1].c:price;
    let chgPct=pct(price,prev),cls=chgPct>=0?'up':'down',sg=chgPct>=0?'+':'';
    let pe=chip.querySelector('.price'),ce=chip.querySelector('.change');
    pe.textContent=fmt(price);
    if(price>oldPrice){pe.style.color='var(--red)';pe.classList.remove('jump-down');void pe.offsetWidth;pe.classList.add('jump-up');setTimeout(()=>pe.style.color='',400)}
    else if(price<oldPrice){pe.style.color='var(--grn)';pe.classList.remove('jump-up');void pe.offsetWidth;pe.classList.add('jump-down');setTimeout(()=>pe.style.color='',400)}
    ce.textContent=sg+fmt(chgPct)+'%';ce.className='change '+cls;
  });
}
function updateTimerDisplay(){
  let t=document.getElementById('header-timer');
  if(state.crashed){t.textContent='💥 已砸盘';t.className='timer urgent';document.getElementById('header-balance').style.color='var(--red)';return;}
  if(state.timer<=10)t.className='timer urgent';
  else if(state.timer<=20)t.className='timer warn';
  else{t.className='timer';t.style.color='var(--grn)';}
  t.textContent='⏱ '+state.timer+'s';
}

// ============ 图表 ============
function renderChart(){
  if(!state.klineReady)return;
  let dom=document.getElementById('chart');
  if(!state.chart){state.chart=echarts.init(dom);window.addEventListener('resize',()=>state.chart&&state.chart.resize());}
  let k=(state.klines[state.selected]||[]).slice(-state.range);
  if(!k.length)return;
  let dates=k.map(d=>d.dt),ohlc=k.map(d=>[d.o,d.c,d.l,d.h]),vols=k.map(d=>d.v);
  let up='#ef4444',down='#10b981';
  state.chart.setOption({
    backgroundColor:'#0a0f1a',animation:true,animationDuration:600,animationEasing:'linear',animationDurationUpdate:500,animationEasingUpdate:'linear',
    tooltip:{trigger:'axis',axisPointer:{type:'cross'},backgroundColor:'#111827',borderColor:'#1e2d3d',textStyle:{color:'#e2e8f0',fontSize:11},
      formatter:function(p){if(!p||!p[0])return'';let d=p[0].data,chg=((d[2]-d[1])/d[1]*100).toFixed(2),s=chg>=0?'+':'',cl=chg>=0?'#ef4444':'#10b981';return '<b>'+p[0].axisValue+'</b><br/>开:<span style="color:'+cl+'">'+d[1].toFixed(2)+'</span> 收:<span style="color:'+cl+'">'+d[2].toFixed(2)+'</span> 涨跌:<span style="color:'+cl+'">'+s+chg+'%</span><br/>高:'+d[4].toFixed(2)+' 低:'+d[3].toFixed(2)+' 量:'+((p[1]?.data||0)/10000).toFixed(0)+'万手';}},
    grid:[{left:'8%',right:'4%',top:'5%',height:'62%'},{left:'8%',right:'4%',top:'74%',height:'18%'}],
    xAxis:[{type:'category',data:dates,gridIndex:0,axisLine:{lineStyle:{color:'#1e2d3d'}},axisLabel:{color:'#64748b',fontSize:9}},{type:'category',data:dates,gridIndex:1,axisLine:{lineStyle:{color:'#1e2d3d'}},axisLabel:{show:false}}],
    yAxis:[{type:'value',gridIndex:0,scale:true,splitLine:{lineStyle:{color:'#1a1f2e'}},axisLabel:{color:'#64748b',fontSize:9}},{type:'value',gridIndex:1,axisLabel:{color:'#64748b',fontSize:8}}],
    series:[{name:'K线',type:'candlestick',xAxisIndex:0,yAxisIndex:0,data:ohlc,itemStyle:{color:up,color0:down,borderColor:up,borderColor0:down}},{name:'量',type:'bar',xAxisIndex:1,yAxisIndex:1,data:vols,itemStyle:{color:function(p){let i=p.dataIndex;return ohlc[i]&&ohlc[i][2]>=ohlc[i][1]?up:down}}}]
  },false);
}

function renderStockList(){
  let html='';
  for(let code in state.prices){
    let s=STOCKS[code],price=state.prices[code];
    let prev=state.klines[code]&&state.klines[code].length>0?state.klines[code][state.klines[code].length-1].c:price;
    let chgPct=pct(price,prev),cls=chgPct>=0?'up':'down',sg=chgPct>=0?'+':'';
    let sel=code===state.selected?' selected':'';
    html+='<div class="stock-chip'+sel+'" onclick="selectStock(\''+code+'\')"><div class="name">'+s.name+'</div><div class="price">'+fmt(price)+'</div><div class="change '+cls+'">'+sg+fmt(chgPct)+'%</div></div>';
  }
  document.getElementById('stock-list').innerHTML=html;
}
function selectStock(code){state.selected=code;renderStockList();renderChart();renderTradeInfo();}
function setRange(n,el){state.range=n;document.querySelectorAll('.range-bar b').forEach(b=>b.classList.remove('active'));el.classList.add('active');renderChart();}
function switchPage(pg){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+pg).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.querySelector('[data-page="'+pg+'"]').classList.add('active');
  if(pg==='market'){setTimeout(()=>{if(state.chart)state.chart.resize();renderChart();},100);}
  if(pg==='trade')renderTradeInfo();
  if(pg==='holdings')renderHoldings();
}

// ============ 交易 ============
function setAction(a){state.action=a;let tabs=document.querySelectorAll('.trade-tabs b');tabs.forEach(t=>t.classList.remove('active'));if(a==='buy'){tabs[0].classList.add('active');tabs[0].classList.add('buy')}else{tabs[1].classList.add('active');tabs[1].classList.add('sell')}let btn=document.getElementById('submit-btn');btn.textContent=a==='buy'?'买 入':'卖 出';btn.className='submit-btn '+a;updateCost();}
function setShares(n){if(n==='max'){let p=state.prices[state.selected];if(state.action==='buy')document.getElementById('shares-input').value=Math.floor(state.balance/p);else{let h=state.holdings[state.selected];document.getElementById('shares-input').value=h?h.shares:0}}else document.getElementById('shares-input').value=n;updateCost();}
function updateCost(){let price=state.prices[state.selected],sh=parseInt(document.getElementById('shares-input').value)||0,amt=price*sh;if(state.action==='buy')document.getElementById('cost-hint').textContent='预计花费: ¥'+fmtMoney(amt)+' | 可用: ¥'+fmtMoney(state.balance);else{let h=state.holdings[state.selected];document.getElementById('cost-hint').textContent='预计收入: ¥'+fmtMoney(amt)+' | 可卖: '+(h?h.shares:0)+' 股';}}
function renderTradeInfo(){
  let s=STOCKS[state.selected],price=state.prices[state.selected];
  let prev=state.klines[state.selected]&&state.klines[state.selected].length>0?state.klines[state.selected][state.klines[state.selected].length-1].c:price;
  let chg=price-prev,chgPct=pct(price,prev),cls=chgPct>=0?'up':'down',sg=chgPct>=0?'+':'';
  let h=state.holdings[state.selected],canBuy=Math.floor(state.balance/price);
  document.getElementById('stock-info').innerHTML='<div class="si-row"><span class="si-name">'+s.name+'</span><span style="font-size:11px;color:var(--sub)">'+state.selected+'</span></div><div class="si-row"><span class="si-price '+cls+'" id="trade-price">'+fmt(price)+'</span><span class="si-change '+cls+'">'+sg+fmt(chg)+' ('+sg+fmt(chgPct)+'%)</span></div><div class="si-detail"><span>可用资金</span><span>¥'+fmtMoney(state.balance)+'</span><span>持仓</span><span>'+(h?h.shares:0)+' 股</span><span>可买</span><span>'+canBuy+' 股</span></div>';
  updateCost();
}
async function executeTrade(){
  if(state.crashed)return toast('市场已崩盘','error');
  if(!state.currentUser)return toast('请先登录','error');
  let code=state.selected,sh=parseInt(document.getElementById('shares-input').value)||0;
  if(sh<=0)return toast('请输入有效股数','error');
  let r=await API('/api/trade',{username:state.currentUser,stock_code:code,action:state.action,shares:sh});
  if(!r.ok)return toast(r.msg,'error');
  state.balance=r.balance;state.holdings=r.holdings;
  if(r.price)state.prices[code]=r.price;
  triggerFlash('green');
  let tp=document.getElementById('trade-price');if(tp){tp.classList.remove('price-bounce');void tp.offsetWidth;tp.classList.add('price-bounce')}
  toast('✅ '+r.msg,state.action==='buy'?'success':'success');
  updateAll();
}

// ============ 持仓 ============
function renderHoldings(){
  let totalValue=state.balance,marketValue=0,items=[];
  for(let code in state.holdings){
    let h=state.holdings[code];if(!h||h.shares<=0)continue;
    let price=state.prices[code],mk=h.shares*price,cost=h.shares*h.avgCost,profit=mk-cost,profitPct=cost>0?(profit/cost*100):0;
    totalValue+=mk;marketValue+=mk;
    items.push({code,name:STOCKS[code].name,shares:h.shares,avgCost:h.avgCost,price,market:mk,profit,profitPct});
  }
  let totalPnl=totalValue-900000;
  document.getElementById('ov-total').textContent='¥'+fmtMoney(totalValue);
  document.getElementById('ov-market').textContent='¥'+fmtMoney(marketValue);
  let pe=document.getElementById('ov-pnl');pe.textContent=(totalPnl>=0?'+':'')+'¥'+fmtMoney(totalPnl);pe.className='ov-value '+(totalPnl>=0?'up':'down');
  let list=document.getElementById('holdings-list');
  if(!items.length){list.innerHTML='<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">暂无持仓</div></div>';return;}
  let html='';items.forEach(it=>{let cls=it.profit>=0?'up':'down',sg=it.profit>=0?'+':'';html+='<div class="holding-item" onclick="state.selected=\''+it.code+'\';switchPage(\'trade\');setTimeout(()=>renderTradeInfo(),200)"><div class="hi-top"><div><span class="hi-name">'+it.name+'</span> <span class="hi-code">'+it.code+'</span></div><span class="hi-profit '+cls+'">'+sg+'¥'+fmtMoney(it.profit)+'</span></div><div class="hi-detail"><span>持仓 <span>'+it.shares+'股</span></span><span>成本 <span>¥'+fmt(it.avgCost)+'</span></span><span>现价 <span>¥'+fmt(it.price)+'</span></span><span>收益率 <span class="'+cls+'">'+sg+fmt(it.profitPct)+'%</span></span></div></div>';});
  list.innerHTML=html;
}
async function resetAccount(){
  if(!confirm('确定重置账户？'))return;
  await API('/api/user/'+state.currentUser,{balance:900000,holdings:{},crashed:0,timer:60});
  state.balance=900000;state.holdings={};state.crashed=false;state.timer=60;
  document.body.className='';document.getElementById('header-balance').style.color='var(--grn)';
  updateAll();updateTimerDisplay();
  toast('✅ 账户已重置','success');
}

function updateAll(){
  document.getElementById('header-balance').textContent='¥'+fmtMoney(state.balance);
  if(state.klineReady){renderStockList();renderChart();}
  renderTradeInfo();renderHoldings();
}

// ============ 闪屏 ============
function triggerFlash(color){let el=document.getElementById('chart-flash');el.classList.remove('green','red');void el.offsetWidth;el.classList.add(color);}

// ============ Toast ============
function toast(msg,type){let el=document.getElementById('toast');el.textContent=msg;el.className='toast '+type;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',type==='crash'?5000:2500);}

// ============ 验证码 ============
let captchaAnswer=0;
function genCaptcha(){let a=Math.floor(Math.random()*20)+1,b=Math.floor(Math.random()*20)+1;let ops=['+','-','×'],op=ops[Math.floor(Math.random()*3)];if(op==='+')captchaAnswer=a+b;else if(op==='-')captchaAnswer=a-b;else captchaAnswer=a*b;return a+' '+op+' '+b+' = ?';}

// ============ 登录/注册 ============
function showAuth(mode){
  let card=document.getElementById('auth-card'),captcha=genCaptcha();
  if(mode==='login'){
    card.innerHTML='<div class="auth-title">🍁 欢迎回来</div><div class="auth-sub">登录你的枫叶炒股账户</div><div class="auth-fields"><input type="text" id="login-user" placeholder="用户名" autocomplete="username"><input type="password" id="login-pass" placeholder="密码" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')handleLogin()"><button class="auth-btn" onclick="handleLogin()">登 录</button></div><div class="auth-switch">还没有账号？<span onclick="showAuth(\'register\')">立即注册</span></div>';
    setTimeout(()=>{let el=document.getElementById('login-user');if(el)el.focus();},200);
  }else{
    card.innerHTML='<div class="auth-title">🍁 注册账号</div><div class="auth-sub">创建账户，即送 900,000 初始资金</div><div class="auth-fields"><input type="text" id="reg-user" placeholder="设置用户名（3-12位）" autocomplete="off"><input type="password" id="reg-pass" placeholder="设置密码（至少4位）" autocomplete="new-password"><input type="password" id="reg-pass2" placeholder="确认密码" autocomplete="new-password"><div class="captcha-row"><input type="text" id="reg-captcha" placeholder="验证码结果" autocomplete="off" onkeydown="if(event.key===\'Enter\')handleRegister()"><div class="captcha-display" id="captcha-display" onclick="refreshCaptcha()">'+captcha+'</div></div><button class="auth-btn" onclick="handleRegister()">注 册</button></div><div class="auth-switch">已有账号？<span onclick="showAuth(\'login\')">去登录</span></div>';
    setTimeout(()=>{let el=document.getElementById('reg-user');if(el)el.focus();},200);
  }
  document.getElementById('auth-overlay').classList.add('show');
}
function refreshCaptcha(){document.getElementById('captcha-display').textContent=genCaptcha();}
function hideAuth(){document.getElementById('auth-overlay').classList.remove('show');}

async function handleLogin(){
  let u=document.getElementById('login-user').value.trim(),p=document.getElementById('login-pass').value;
  if(!u)return toast('请输入用户名','error');
  if(!p)return toast('请输入密码','error');
  let r=await API('/api/login',{username:u,password:p});
  if(!r.ok)return toast(r.msg,'error');
  if(r.admin){hideAuth();enterAdminMode();return;}
  state.currentUser=r.username;state.balance=r.balance;state.holdings=r.holdings;state.crashed=!!r.crashed;state.timer=r.timer;
  document.getElementById('header-user').textContent=state.currentUser;
  hideAuth();
  state.klineReady=false;
  connectSSE();
  updateAll();updateTimerDisplay();
  toast('✅ 欢迎回来，'+state.currentUser+'！','success');
}
async function handleRegister(){
  let u=document.getElementById('reg-user').value.trim(),p=document.getElementById('reg-pass').value,p2=document.getElementById('reg-pass2').value,c=document.getElementById('reg-captcha').value.trim();
  if(!u||u.length<3||u.length>12)return toast('用户名须为3-12位','error');
  if(!p||p.length<4)return toast('密码至少4位','error');
  if(p!==p2)return toast('两次密码不一致','error');
  if(!c||parseInt(c)!==captchaAnswer)return toast('验证码错误','error');
  let r=await API('/api/register',{username:u,password:p});
  if(!r.ok)return toast(r.msg,'error');
  state.currentUser=u;state.balance=900000;state.holdings={};state.crashed=false;state.timer=60;
  document.getElementById('header-user').textContent=u;
  hideAuth();
  state.klineReady=false;
  connectSSE();
  updateAll();updateTimerDisplay();
  toast('🎉 注册成功！赠送 900,000 初始资金','success');
}
function doLogout(){
  if(!state.currentUser)return;
  if(!confirm('确定退出登录？'))return;
  if(state.es)state.es.close();
  state.currentUser=null;state.balance=900000;state.holdings={};state.timer=60;state.crashed=false;state.adminMode=false;
  document.getElementById('header-user').textContent='';
  document.getElementById('admin-indicator').classList.remove('show');
  showAuth('login');
}

// ============ 庄家后门 ============
let adminClickCount=0,adminClickTimer=null;
document.getElementById('logo-btn').addEventListener('click',function(e){
  e.stopPropagation();adminClickCount++;
  if(adminClickTimer)clearTimeout(adminClickTimer);
  if(adminClickCount>=5){adminClickCount=0;enterAdminMode();}
  else adminClickTimer=setTimeout(()=>adminClickCount=0,2000);
});

function enterAdminMode(){
  state.adminMode=true;
  document.getElementById('admin-indicator').classList.add('show');
  if(!state.currentUser){state.currentUser='ADMIN';document.getElementById('header-user').textContent='ADMIN';}
  renderAdminPanel();
  document.getElementById('admin-overlay').classList.add('show');
  toast('🔑 庄家后台已激活','warning');
}
function closeAdmin(){document.getElementById('admin-overlay').classList.remove('show');}
async function renderAdminPanel(){
  let r=await fetch('/api/admin/users').then(r=>r.json());
  let users=r.users||[];
  let html='<div class="ap-section"><div class="ap-label">⚡ 全局操作</div><button class="ap-btn crash" onclick="adminForceCrash()">💥 立即砸盘收割</button><button class="ap-btn warn" onclick="adminResetAll()">🔄 重置所有用户</button></div><div class="ap-section"><div class="ap-label">👥 注册用户 ('+users.length+'人)</div>';
  if(!users.length){html+='<div style="font-size:12px;color:var(--sub);padding:12px;text-align:center">暂无注册用户</div>';}
  else{users.forEach(u=>{let cr=u.crashed?'<span class="ap-crash">已砸</span>':'';html+='<div class="ap-user-row"><span class="ap-uname">'+u.username+'</span><span class="ap-bal">¥'+fmtMoney(u.balance)+'</span>'+cr+'<button class="ap-small-btn enter" onclick="adminSwitchUser(\''+u.username+'\')">迁入</button><button class="ap-small-btn del" onclick="adminDeleteUser(\''+u.username+'\')">删</button></div>';});}
  html+='</div><button class="ap-btn normal" onclick="closeAdmin()">关闭后台</button>';
  document.getElementById('admin-body').innerHTML=html;
}
async function adminForceCrash(){if(!confirm('确定立即砸盘？'))return;await API('/api/admin/crash',{});renderAdminPanel();}
async function adminResetAll(){if(!confirm('确定重置所有用户？'))return;await API('/api/admin/reset',{});state.balance=900000;state.holdings={};state.crashed=false;state.timer=60;document.body.className='';document.getElementById('header-balance').style.color='var(--grn)';updateAll();updateTimerDisplay();renderAdminPanel();toast('✅ 已重置','success');}
async function adminSwitchUser(uname){
  closeAdmin();
  let r=await fetch('/api/user/'+uname).then(r=>r.json());
  if(!r.ok)return toast(r.msg,'error');
  state.currentUser=uname;state.balance=r.balance;state.holdings=r.holdings;state.crashed=!!r.crashed;state.timer=r.timer;
  state.adminMode=true;document.getElementById('admin-indicator').classList.add('show');
  document.getElementById('header-user').textContent=uname;
  document.body.className='';document.getElementById('header-balance').style.color='var(--grn)';
  updateAll();updateTimerDisplay();
  toast('✅ 已迁入：'+uname,'success');
}
async function adminDeleteUser(uname){if(!confirm('删除用户「'+uname+'」？'))return;await API('/api/admin/reset',{username:uname});renderAdminPanel();toast('🗑 已删除：'+uname,'error');}

// 键盘
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&document.activeElement===document.getElementById('shares-input'))executeTrade();});

// 启动
showAuth('login');
</script>
</body>
</html>
