<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>枫叶炒股</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root{
  --bg:#0a0f1a;
  --card:#111827;
  --bd:#1e2d3d;
  --tx:#e2e8f0;
  --sub:#64748b;
  --acc:#f59e0b;
  --red:#ef4444;
  --grn:#10b981;
  --blu:#3b82f6;
  --nav-h:60px;
  --hd-h:48px;
  --safe:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);
  color:var(--tx);
  height:100vh;height:100dvh;
  overflow:hidden;
  display:flex;flex-direction:column;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
  transition:background .6s;
}

.header{
  height:var(--hd-h);min-height:var(--hd-h);
  background:var(--card);
  border-bottom:1px solid var(--bd);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;z-index:10;flex-shrink:0;
}
.header .logo{font-size:15px;font-weight:800;background:linear-gradient(135deg,var(--acc),#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header .right{display:flex;align-items:center;gap:10px}
.header .timer{
  font-size:13px;font-weight:700;color:var(--grn);
  background:rgba(16,185,129,.12);padding:3px 10px;border-radius:12px;
  min-width:60px;text-align:center;transition:all .3s;
}
.header .timer.warn{color:var(--acc);background:rgba(245,158,11,.15);animation:pulse .5s infinite}
.header .timer.urgent{color:var(--red);background:rgba(239,68,68,.2);animation:pulse .3s infinite}
@keyframes pulse{50%{opacity:.4;transform:scale(1.05)}}
.header .bal{font-size:13px;font-weight:700;color:var(--grn);transition:color .3s}
.header .user{font-size:11px;color:var(--sub);cursor:pointer;padding:4px 10px;border:1px solid var(--bd);border-radius:14px;transition:all .2s}
.header .user:active{color:var(--acc);border-color:var(--acc)}

.main{flex:1;overflow:hidden;position:relative}
.page{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page.active{display:flex}

/* 行情 */
.market-wrap{flex:1;display:flex;flex-direction:column;min-height:0}
.stock-scroll{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.stock-scroll::-webkit-scrollbar{display:none}
.stock-chip{
  flex:0 0 auto;min-width:90px;
  background:var(--card);border:1px solid var(--bd);
  border-radius:12px;padding:10px 12px;
  cursor:pointer;text-align:center;
  transition:all .15s;position:relative;overflow:hidden;
}
.stock-chip:active{transform:scale(.96)}
.stock-chip.selected{border-color:var(--acc);background:#1a1f2e}
.stock-chip .name{font-size:12px;font-weight:600;margin-bottom:2px;position:relative;z-index:1}
.stock-chip .price{font-size:15px;font-weight:700;position:relative;z-index:1;display:inline-block}
.stock-chip .change{font-size:10px;position:relative;z-index:1}
.stock-chip .jump-dot{
  position:absolute;width:6px;height:6px;border-radius:50%;
  background:var(--red);top:50%;right:8px;transform:translateY(-50%);
  opacity:0;z-index:0;
}
.stock-chip .jump-dot.on{animation:dotPop .6s ease-out forwards}
@keyframes dotPop{
  0%{opacity:1;transform:translateY(-50%) scale(0)}
  40%{opacity:1;transform:translateY(-50%) scale(2.5)}
  100%{opacity:0;transform:translateY(-50%) scale(3)}
}

.chart-area{flex:1;min-height:200px;position:relative}
#chart{width:100%;height:100%}
.chart-flash{
  position:absolute;top:0;left:0;width:100%;height:100%;
  pointer-events:none;opacity:0;z-index:2;border-radius:8px;
}
.chart-flash.green{background:rgba(16,185,129,.12);opacity:1;animation:flashOut .5s ease-out forwards}
.chart-flash.red{background:rgba(239,68,68,.2);opacity:1;animation:flashOut .8s ease-out forwards}
@keyframes flashOut{to{opacity:0}}

.range-bar{display:flex;gap:4px;padding:6px 12px 10px;flex-shrink:0}
.range-bar b{padding:5px 16px;background:var(--card);border:1px solid var(--bd);border-radius:16px;color:var(--sub);font-size:11px;cursor:pointer;transition:all .15s}
.range-bar b.active{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}

.up{color:var(--red)}.down{color:var(--grn)}

/* 交易 */
.trade-pg{padding:14px}
.stock-info{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:12px}
.stock-info .si-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.stock-info .si-name{font-size:17px;font-weight:700}
.stock-info .si-price{font-size:32px;font-weight:800;display:inline-block;transition:color .3s}
@keyframes priceBounce{
  0%{transform:scale(1)}
  30%{transform:scale(1.12)}
  60%{transform:scale(.95)}
  100%{transform:scale(1)}
}
.price-bounce{animation:priceBounce .45s ease-out}
.stock-info .si-change{font-size:12px;margin-left:6px}
.stock-info .si-detail{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)}
.stock-info .si-detail span{color:var(--tx);font-weight:600}

.trade-tabs{display:flex;gap:0;margin-bottom:12px}
.trade-tabs b{flex:1;padding:11px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:14px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s}
.trade-tabs b:first-child{border-radius:10px 0 0 10px}
.trade-tabs b:last-child{border-radius:0 10px 10px 0}
.trade-tabs b.active.buy{background:var(--red);color:#fff;border-color:var(--red)}
.trade-tabs b.active.sell{background:var(--grn);color:#fff;border-color:var(--grn)}

.trade-form{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
.trade-form label{display:block;font-size:12px;color:var(--sub);margin-bottom:8px}
.trade-form .input-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.trade-form .input-row input{flex:1;padding:11px 14px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;color:var(--tx);font-size:16px;outline:none;transition:border-color .2s}
.trade-form .input-row input:focus{border-color:var(--acc)}
.trade-form .quick-btn{padding:5px 10px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;color:var(--sub);font-size:10px;cursor:pointer;white-space:nowrap}
.trade-form .cost-hint{font-size:11px;color:var(--sub);margin-bottom:12px;min-height:16px}
.trade-form .submit-btn{width:100%;padding:13px;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;color:#fff;transition:all .15s}
.trade-form .submit-btn:active{transform:scale(.98);opacity:.85}
.trade-form .submit-btn.buy{background:var(--red)}
.trade-form .submit-btn.sell{background:var(--grn)}

/* 持仓 */
.holdings-pg{padding:14px}
.overview{display:flex;gap:8px;margin-bottom:14px}
.overview .ov-card{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:center}
.overview .ov-card .ov-label{font-size:10px;color:var(--sub);margin-bottom:4px}
.overview .ov-card .ov-value{font-size:17px;font-weight:700}
.holding-item{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.holding-item:active{background:#161e2e}
.holding-item .hi-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.holding-item .hi-name{font-size:14px;font-weight:700}
.holding-item .hi-code{font-size:10px;color:var(--sub)}
.holding-item .hi-profit{font-size:14px;font-weight:700}
.holding-item .hi-detail{display:flex;justify-content:space-between;font-size:11px;color:var(--sub)}
.holding-item .hi-detail span{color:var(--tx)}
.empty-state{text-align:center;padding:50px 20px;color:var(--sub)}
.empty-state .empty-icon{font-size:40px;margin-bottom:10px}
.empty-state .empty-text{font-size:14px}
.reset-btn{display:block;width:100%;margin-top:12px;padding:12px;background:transparent;border:1px solid var(--red);border-radius:10px;color:var(--red);font-size:14px;cursor:pointer;text-align:center;font-weight:600}

/* 底部导航 */
.navbar{height:var(--nav-h);min-height:var(--nav-h);background:var(--card);border-top:1px solid var(--bd);display:flex;z-index:10;flex-shrink:0;padding-bottom:var(--safe)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--sub);transition:all .15s;position:relative}
.nav-item:active{opacity:.7}
.nav-item.active{color:var(--acc)}
.nav-item .nav-icon{font-size:22px;line-height:1}
.nav-item .nav-label{font-size:10px;font-weight:500}
.nav-item.active::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:3px;background:var(--acc);border-radius:0 0 3px 3px}

/* 登录弹层 */
.auth-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(2,6,14,.95);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px}
.auth-overlay.show{display:flex}
.auth-card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:32px 24px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:authIn .35s ease-out}
@keyframes authIn{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.auth-card .auth-title{font-size:24px;font-weight:800;text-align:center;margin-bottom:6px;background:linear-gradient(135deg,var(--acc),#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.auth-card .auth-sub{font-size:13px;color:var(--sub);text-align:center;margin-bottom:24px;line-height:1.5}
.auth-card .auth-fields{display:flex;flex-direction:column;gap:12px}
.auth-card .auth-fields input{width:100%;padding:14px 16px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;color:var(--tx);font-size:16px;outline:none;transition:border-color .2s}
.auth-card .auth-fields input:focus{border-color:var(--acc)}
.auth-card .auth-fields input::placeholder{color:var(--sub);font-size:14px}
.auth-card .captcha-row{display:flex;gap:10px;align-items:center}
.auth-card .captcha-row input{flex:1}
.auth-card .captcha-display{background:linear-gradient(135deg,#1a1f2e,#0f172a);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;font-size:24px;font-weight:900;letter-spacing:4px;color:var(--acc);cursor:pointer;min-width:100px;text-align:center;user-select:none;font-family:'Courier New',monospace;text-decoration:line-through;flex-shrink:0}
.auth-card .auth-btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;color:#000;background:linear-gradient(135deg,var(--acc),#fbbf24);transition:all .15s;margin-top:4px;letter-spacing:2px}
.auth-card .auth-btn:active{transform:scale(.98);opacity:.85}
.auth-card .auth-switch{text-align:center;font-size:13px;color:var(--sub);margin-top:18px;cursor:pointer}
.auth-card .auth-switch span{color:var(--blu);text-decoration:underline;font-weight:600}

/* 庄家后门面板 */
.admin-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:10000;display:none;align-items:center;justify-content:center;padding:20px}
.admin-overlay.show{display:flex}
.admin-panel{background:var(--card);border:2px solid var(--acc);border-radius:16px;width:100%;max-width:500px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 0 60px rgba(245,158,11,.2);animation:authIn .3s ease-out}
.admin-panel .ap-header{background:linear-gradient(135deg,#1a0f00,#2d1a00);padding:16px 20px;border-radius:14px 14px 0 0;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--acc)}
.admin-panel .ap-header .ap-title{font-size:16px;font-weight:800;color:var(--acc);letter-spacing:2px}
.admin-panel .ap-header .ap-close{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:var(--tx);font-size:18px;cursor:pointer;line-height:32px;text-align:center}
.admin-panel .ap-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.admin-panel .ap-btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;color:#fff;transition:all .15s}
.admin-panel .ap-btn:active{transform:scale(.98);opacity:.85}
.admin-panel .ap-btn.crash{background:var(--red)}
.admin-panel .ap-btn.warn{background:var(--acc);color:#000}
.admin-panel .ap-btn.danger{background:#7f1d1d;border:1px solid var(--red)}
.admin-panel .ap-btn.normal{background:var(--blu)}
.admin-panel .ap-section{margin-top:8px}
.admin-panel .ap-section .ap-label{font-size:11px;color:var(--sub);margin-bottom:6px;font-weight:600}
.admin-panel .ap-user-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;margin-bottom:4px;gap:8px}
.admin-panel .ap-user-row .ap-uname{font-size:13px;font-weight:600;flex:1}
.admin-panel .ap-user-row .ap-bal{font-size:12px;color:var(--grn);font-weight:600;white-space:nowrap}
.admin-panel .ap-user-row .ap-crash{font-size:10px;padding:4px 8px;border-radius:6px;background:rgba(239,68,68,.15);color:var(--red);white-space:nowrap}
.admin-panel .ap-user-row .ap-small-btn{padding:6px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:none;white-space:nowrap;transition:all .15s}
.admin-panel .ap-user-row .ap-small-btn:active{transform:scale(.95)}
.admin-panel .ap-user-row .ap-small-btn.enter{background:var(--blu);color:#fff}
.admin-panel .ap-user-row .ap-small-btn.del{background:rgba(239,68,68,.15);color:var(--red)}

.admin-indicator{position:fixed;top:8px;right:8px;font-size:10px;color:var(--acc);background:rgba(245,158,11,.15);padding:2px 8px;border-radius:8px;z-index:10001;display:none;pointer-events:none}
.admin-indicator.show{display:block}

/* Toast */
.toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:9998;animation:toastIn .3s;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.toast.success{background:#0a2e1a;border:1px solid var(--grn);color:var(--grn)}
.toast.error{background:#2e0a0a;border:1px solid var(--red);color:var(--red)}
.toast.warning{background:#2e1f0a;border:1px solid var(--acc);color:var(--acc)}
.toast.crash{background:#3d0000;border:2px solid var(--red);color:var(--red);font-size:16px;padding:14px 24px;animation:crashShake .5s ease-out}
@keyframes crashShake{
  0%,100%{transform:translateX(-50%)}
  10%,50%,90%{transform:translateX(calc(-50% - 6px))}
  30%,70%{transform:translateX(calc(-50% + 6px))}
}

/* 砸盘 - 多阶段闪屏 */
body.crash-phase1{background:#1a0000}
body.crash-phase2{background:#2d0000}
body.crash-phase3{background:#3d0000}
body.crash-phase4{background:var(--bg)}

@media(min-width:768px){
  .market-wrap{flex-direction:row}
  .stock-scroll{flex-direction:column;width:200px;min-width:200px;max-width:200px;border-right:1px solid var(--bd);overflow-y:auto;overflow-x:hidden;padding:8px;gap:4px}
  .stock-chip{min-width:auto;text-align:left;padding:10px 14px}
  .chart-area{min-height:380px}
  .trade-pg,.holdings-pg{max-width:460px;margin:0 auto}
}
</style>
</head>
<body>

<!-- 登录弹层 -->
<div class="auth-overlay" id="auth-overlay">
  <div class="auth-card" id="auth-card"></div>
</div>

<!-- 顶部栏 -->
<div class="header">
  <div class="logo">🍁 枫叶炒股</div>
  <div class="right">
    <div class="timer" id="header-timer">⏱ 60s</div>
    <div class="bal" id="header-balance">¥900,000.00</div>
    <div class="user" id="header-user" onclick="doLogout()"></div>
  </div>
</div>

<!-- 主内容 -->
<div class="main">
  <div class="page active" id="page-market">
    <div class="market-wrap">
      <div class="stock-scroll" id="stock-list"></div>
      <div class="chart-area">
        <div id="chart"></div>
        <div class="chart-flash" id="chart-flash"></div>
      </div>
      <div class="range-bar">
        <b class="active" onclick="setRange(30,this)">1月</b>
        <b onclick="setRange(60,this)">2月</b>
        <b onclick="setRange(90,this)">3月</b>
        <b onclick="setRange(200,this)">全部</b>
      </div>
    </div>
  </div>

  <div class="page" id="page-trade">
    <div class="trade-pg">
      <div class="stock-info" id="stock-info"></div>
      <div class="trade-tabs">
        <b class="active buy" onclick="setAction('buy')">买 入</b>
        <b class="sell" onclick="setAction('sell')">卖 出</b>
      </div>
      <div class="trade-form">
        <label>交易股数</label>
        <div class="input-row">
          <input type="number" id="shares-input" value="10" min="1" oninput="updateCost()">
          <span class="quick-btn" onclick="setShares(1)">1</span>
          <span class="quick-btn" onclick="setShares(10)">10</span>
          <span class="quick-btn" onclick="setShares(100)">100</span>
          <span class="quick-btn" onclick="setShares('max')">最大</span>
        </div>
        <div class="cost-hint" id="cost-hint"></div>
        <div class="submit-btn buy" id="submit-btn" onclick="executeTrade()">买 入</div>
      </div>
    </div>
  </div>

  <div class="page" id="page-holdings">
    <div class="holdings-pg">
      <div class="overview">
        <div class="ov-card"><div class="ov-label">总资产</div><div class="ov-value" style="color:var(--blu)" id="ov-total">¥900,000.00</div></div>
        <div class="ov-card"><div class="ov-label">持仓市值</div><div class="ov-value" style="color:var(--acc)" id="ov-market">¥0.00</div></div>
        <div class="ov-card"><div class="ov-label">总盈亏</div><div class="ov-value" id="ov-pnl">¥0.00</div></div>
      </div>
      <div id="holdings-list"></div>
      <div class="reset-btn" onclick="resetAccount()">🔄 重置账户</div>
    </div>
  </div>
</div>

<div class="navbar">
  <div class="nav-item active" data-page="market" onclick="switchPage('market')"><span class="nav-icon">📈</span><span class="nav-label">行情</span></div>
  <div class="nav-item" data-page="trade" onclick="switchPage('trade')"><span class="nav-icon">💹</span><span class="nav-label">交易</span></div>
  <div class="nav-item" data-page="holdings" onclick="switchPage('holdings')"><span class="nav-icon">📋</span><span class="nav-label">持仓</span></div>
</div>

<div class="toast" id="toast" style="display:none"></div>

<!-- 庄家后门 -->
<div class="admin-overlay" id="admin-overlay">
  <div class="admin-panel">
    <div class="ap-header">
      <span class="ap-title">🕵️ 庄家后台</span>
      <button class="ap-close" onclick="closeAdmin()">✕</button>
    </div>
    <div class="ap-body" id="admin-body"></div>
  </div>
</div>
<div class="admin-indicator" id="admin-indicator">🔑 后门已激活</div>

<script>
const STOCKS={
  '000001':{name:'平安银行',base:12.5},
  '600519':{name:'贵州茅台',base:1680},
  '000858':{name:'五粮液',base:156.8},
  '601318':{name:'中国平安',base:45.2},
  '600036':{name:'招商银行',base:38.6},
  '300750':{name:'宁德时代',base:210.5},
  '002594':{name:'比亚迪',base:268.3},
  '688981':{name:'中芯国际',base:52.4},
  '300059':{name:'东方财富',base:18.9},
  '600276':{name:'恒瑞医药',base:48.7}
};

let state={
  prices:{},
  klines:{},
  balance:900000,
  holdings:{},
  selected:'600519',
  range:30,
  action:'buy',
  currentUser:null,
  chart:null,
  timer:60,
  crashed:false,
  tickId:null,
  timerId:null,
  resetCount:0,
  adminMode:false
};

function gauss(mean,std){
  let u=0,v=0;
  while(u===0)u=Math.random();
  while(v===0)v=Math.random();
  return mean+std*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}
function hashPassword(pw){
  let h=0;
  for(let i=0;i<pw.length;i++){h=((h<<5)-h)+pw.charCodeAt(i);h|=0;}
  return h.toString(36)+'_'+pw.length;
}
function fmt(n){return n.toFixed(2)}
function fmtMoney(n){
  let parts=n.toFixed(2).split('.');
  parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return parts.join('.');
}
function pct(a,b){return b===0?0:((a-b)/b*100);}

// ============ K线跳动（核心）============
function tickAllPrices(){
  if(state.crashed)return;
  let oldPrices={};
  for(let code in STOCKS)oldPrices[code]=state.prices[code];

  for(let code in STOCKS){
    let price=state.prices[code];
    let vol=price*0.006; // 波动幅度 0.6%
    // 开局正向漂移：均值 +0.3% 每 tick，保证价格慢慢涨
    let drift=vol*0.5; // 正向漂移 = 波动幅度的 50%
    let delta=gauss(drift,vol);
    let newPrice=+(price+delta).toFixed(2);
    newPrice=Math.max(0.01,newPrice);
    state.prices[code]=newPrice;

    // 更新K线最后一根蜡烛
    let k=state.klines[code];
    if(k&&k.length>0){
      let last=k[k.length-1];
      last.c=newPrice;
      last.h=Math.max(last.h,newPrice);
      last.l=Math.min(last.l,newPrice);
      last.v+=Math.floor(Math.random()*30000+5000);
    }
  }

  // 更新UI - 带动画
  animateStockPrices(oldPrices);
  if(document.getElementById('page-trade').classList.contains('active'))renderTradeInfo();
  if(document.getElementById('page-holdings').classList.contains('active'))renderHoldings();
  renderChart();
}

// 带动画效果更新股票价格
function animateStockPrices(oldPrices){
  let chips=document.querySelectorAll('.stock-chip'),codes=Object.keys(state.prices);
  chips.forEach((chip,i)=>{
    if(i>=codes.length)return;
    let code=codes[i],price=state.prices[code],oldPrice=oldPrices[code];
    let prev=state.klines[code]?state.klines[code][state.klines[code].length-1].c:price;
    let chgPct=pct(price,prev),cls=chgPct>=0?'up':'down',sg=chgPct>=0?'+':'';
    let pe=chip.querySelector('.price'),ce=chip.querySelector('.change');
    pe.textContent=fmt(price);
    // 价格跳动动画
    if(price>oldPrice){
      pe.style.color='var(--red)';
      pe.classList.remove('jump-down');void pe.offsetWidth;pe.classList.add('jump-up');
      // 小绿点
      let dot=chip.querySelector('.jump-dot');
      if(dot){dot.classList.remove('on');void dot.offsetWidth;dot.classList.add('on');}
      setTimeout(()=>pe.style.color='',400);
    }else if(price<oldPrice){
      pe.style.color='var(--grn)';
      pe.classList.remove('jump-up');void pe.offsetWidth;pe.classList.add('jump-down');
      setTimeout(()=>pe.style.color='',400);
    }
    ce.textContent=sg+fmt(chgPct)+'%';ce.className='change '+cls;
  });
}

// ============ 多阶段砸盘收割 ============
function triggerCrash(){
  if(state.crashed)return;
  state.crashed=true;
  if(state.tickId){clearInterval(state.tickId);state.tickId=null;}
  updateTimerDisplay();

  // 记录砸盘前价格用于动画
  let crashPrices={};
  for(let code in STOCKS){
    crashPrices[code]=state.prices[code];
  }

  // 阶段1: 闪红 (0ms)
  document.body.className='crash-phase1';
  triggerFlash('red');

  // 阶段2: 深红 + 价格暴跌到 5% (200ms)
  setTimeout(()=>{
    document.body.className='crash-phase2';
    triggerFlash('red');
    for(let code in STOCKS){
      let oldPrice=crashPrices[code];
      let ratio=0.03+Math.random()*0.04; // 3%-7%
      state.prices[code]=+(oldPrice*ratio).toFixed(2);
      let k=state.klines[code];
      if(k&&k.length>0){
        let last=k[k.length-1];
        last.c=state.prices[code];
        last.h=Math.max(last.h,oldPrice);
        last.l=Math.min(last.l,state.prices[code]);
        last.v+=Math.floor(Math.random()*800000+200000);
      }
    }
    updateAll();
  },200);

  // 阶段3: 更红 + 暴跌到 1% (500ms)
  setTimeout(()=>{
    document.body.className='crash-phase3';
    triggerFlash('red');
    for(let code in STOCKS){
      let oldPrice=crashPrices[code];
      let ratio=0.005+Math.random()*0.015; // 0.5%-2%
      state.prices[code]=+(oldPrice*ratio).toFixed(2);
      let k=state.klines[code];
      if(k&&k.length>0){
        let last=k[k.length-1];
        last.c=state.prices[code];
        last.l=Math.min(last.l,state.prices[code]);
        last.v+=Math.floor(Math.random()*500000+100000);
      }
    }
    updateAll();
  },500);

  // 阶段4: 恢复底色 (1000ms)
  setTimeout(()=>{
    document.body.className='crash-phase4';
    updateAll();
  },1000);

  toast('💥 庄家砸盘！所有股票暴跌99%！你的 ¥'+fmtMoney(900000)+' 几乎归零！','crash');

  saveUserData();
}

// ============ K线生成 ============
function generateKlines(code){
  let s=STOCKS[code],cur=s.base*(0.7+Math.random()*0.6),klines=[],now=new Date();
  for(let i=200;i>0;i--){
    let d=new Date(now);d.setDate(d.getDate()-i);
    let ds=d.toISOString().split('T')[0];
    let ch=gauss(0,cur*0.02),o=cur,c=cur+ch;
    let h=Math.max(o,c)*(1+Math.random()*0.02),l=Math.min(o,c)*(1-Math.random()*0.02);
    let v=Math.floor(100000+Math.random()*4900000);
    klines.push({dt:ds,o:+o.toFixed(2),c:+c.toFixed(2),h:+h.toFixed(2),l:+l.toFixed(2),v:v});
    cur=c;
  }
  return klines;
}

    ],
    series:[
      {name:'K线',type:'candlestick',xAxisIndex:0,yAxisIndex:0,data:ohlc,itemStyle:{color:up,color0:down,borderColor:up,borderColor0:down}},
      {name:'量',type:'bar',xAxisIndex:1,yAxisIndex:1,data:vols,itemStyle:{color:function(p){let i=p.dataIndex;return ohlc[i]&&ohlc[i][2]>=ohlc[i][1]?up:down}}}
    ]
  },false);
}

// ============ 股票列表 ============
function renderStockList(){
  let html='';
  for(let code in state.prices){
    let s=STOCKS[code],price=state.prices[code];
    let prev=state.klines[code]?state.klines[code][state.klines[code].length-1].c:price;
    let chgPct=pct(price,prev),cls=chgPct>=0?'up':'down',sg=chgPct>=0?'+':'';
    let sel=code===state.selected?' selected':'';
    html+='<div class="stock-chip'+sel+'" onclick="selectStock(\''+code+'\')"><div class="name">'+s.name+'</div><div class="price">'+fmt(price)+'</div><div class="change '+cls+'">'+sg+fmt(chgPct)+'%</div><div class="jump-dot"></div></div>';
  }
  document.getElementById('stock-list').innerHTML=html;
}

function selectStock(code){state.selected=code;renderStockList();renderChart();renderTradeInfo();}
function setRange(n,el){state.range=n;document.querySelectorAll('.range-bar b').forEach(b=>b.classList.remove('active'));el.classList.add('active');renderChart();}

// ============ 页面切换 ============
function switchPage(pg){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+pg).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.querySelector('[data-page="'+pg+'"]').classList.add('active');
  if(pg==='market'){setTimeout(()=>{if(state.chart)state.chart.resize();renderChart();},100);}
  if(pg==='trade')renderTradeInfo();
  if(pg==='holdings')renderHoldings();
}

// ============ 交易 ============
function setAction(a){
  state.action=a;
  let tabs=document.querySelectorAll('.trade-tabs b');
  tabs.forEach(t=>t.classList.remove('active'));
  if(a==='buy'){tabs[0].classList.add('active');tabs[0].classList.add('buy');}
  else{tabs[1].classList.add('active');tabs[1].classList.add('sell');}
  let btn=document.getElementById('submit-btn');
  btn.textContent=a==='buy'?'买 入':'卖 出';
  btn.className='submit-btn '+a;
  updateCost();
}
function setShares(n){
  if(n==='max'){
    let p=state.prices[state.selected];
    if(state.action==='buy')document.getElementById('shares-input').value=Math.floor(state.balance/p);
    else{let h=state.holdings[state.selected];document.getElementById('shares-input').value=h?h.shares:0;}
  }else{document.getElementById('shares-input').value=n;}
  updateCost();
}
function updateCost(){
  let price=state.prices[state.selected],sh=parseInt(document.getElementById('shares-input').value)||0,amt=price*sh;
  if(state.action==='buy')document.getElementById('cost-hint').textContent='预计花费: ¥'+fmtMoney(amt)+' | 可用: ¥'+fmtMoney(state.balance);
  else{let h=state.holdings[state.selected];document.getElementById('cost-hint').textContent='预计收入: ¥'+fmtMoney(amt)+' | 可卖: '+(h?h.shares:0)+' 股';}
}
function renderTradeInfo(){
  let s=STOCKS[state.selected],price=state.prices[state.selected];
  let prev=state.klines[state.selected]?state.klines[state.selected][state.klines[state.selected].length-1].c:price;
  let chg=price-prev,chgPct=pct(price,prev),cls=chgPct>=0?'up':'down',sg=chgPct>=0?'+':'';
  let h=state.holdings[state.selected],canBuy=Math.floor(state.balance/price);
  document.getElementById('stock-info').innerHTML=
    '<div class="si-row"><span class="si-name">'+s.name+'</span><span style="font-size:11px;color:var(--sub)">'+state.selected+'</span></div>'+
    '<div class="si-row"><span class="si-price '+cls+'" id="trade-price">'+fmt(price)+'</span>'+
    '<span class="si-change '+cls+'">'+sg+fmt(chg)+' ('+sg+fmt(chgPct)+'%)</span></div>'+
    '<div class="si-detail"><span>可用资金</span><span>¥'+fmtMoney(state.balance)+'</span><span>持仓</span><span>'+(h?h.shares:0)+' 股</span><span>可买</span><span>'+canBuy+' 股</span></div>';
  updateCost();
}

function executeTrade(){
  if(state.crashed)return toast('市场已崩盘，无法交易','error');
  let code=state.selected,s=STOCKS[code],price=state.prices[code];
  let sh=parseInt(document.getElementById('shares-input').value)||0;
  if(sh<=0)return toast('请输入有效股数','error');

  if(state.action==='buy'){
    let cost=price*sh;
    if(state.balance<cost)return toast('余额不足！需 ¥'+fmtMoney(cost),'error');
    state.balance-=cost;
    if(!state.holdings[code])state.holdings[code]={shares:0,avgCost:0};
    let h=state.holdings[code],tc=h.shares*h.avgCost+cost;
    h.shares+=sh;h.avgCost=tc/h.shares;

    // 买入后该股票额外跳涨（引诱加仓）
    let boost=price*0.02*(1+sh/100); // 买越多涨越多
    state.prices[code]=+(price+boost).toFixed(2);
    let k=state.klines[code];
    if(k&&k.length>0){
      let last=k[k.length-1];
      last.c=state.prices[code];
      last.h=Math.max(last.h,state.prices[code]);
    }
    triggerFlash('green');
    // 价格弹跳动画
    let tp=document.getElementById('trade-price');
    if(tp){tp.classList.remove('price-bounce');void tp.offsetWidth;tp.classList.add('price-bounce');}

    toast('✅ 买入成功！'+s.name+' '+sh+'股 @ ¥'+fmt(price)+' （价格已拉升！）','success');
  }else{
    if(!state.holdings[code]||state.holdings[code].shares<sh)return toast('持仓不足！','error');
    state.balance+=price*sh;
    state.holdings[code].shares-=sh;
    if(state.holdings[code].shares<=0)delete state.holdings[code];
    toast('✅ 卖出成功！'+s.name+' '+sh+'股 @ ¥'+fmt(price),'success');
  }
  saveUserData();updateAll();
}

// ============ 持仓 ============
function renderHoldings(){
  let totalValue=state.balance,marketValue=0,items=[];
  for(let code in state.holdings){
    let h=state.holdings[code];if(h.shares<=0)continue;
    let price=state.prices[code],mk=h.shares*price,cost=h.shares*h.avgCost,profit=mk-cost,profitPct=cost>0?(profit/cost*100):0;
    totalValue+=mk;marketValue+=mk;
    items.push({code,name:STOCKS[code].name,shares:h.shares,avgCost:h.avgCost,price,market:mk,profit,profitPct});
  }
  let totalPnl=totalValue-900000;
  document.getElementById('ov-total').textContent='¥'+fmtMoney(totalValue);
  document.getElementById('ov-market').textContent='¥'+fmtMoney(marketValue);
  let pe=document.getElementById('ov-pnl');pe.textContent=(totalPnl>=0?'+':'')+'¥'+fmtMoney(totalPnl);pe.className='ov-value '+(totalPnl>=0?'up':'down');
  let list=document.getElementById('holdings-list');
  if(!items.length){list.innerHTML='<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">暂无持仓</div><div style="font-size:11px;margin-top:6px">去交易页买入股票吧</div></div>';return;}
  let html='';items.forEach(it=>{
    let cls=it.profit>=0?'up':'down',sg=it.profit>=0?'+':'';
    html+='<div class="holding-item" onclick="state.selected=\''+it.code+'\';switchPage(\'trade\');setTimeout(()=>renderTradeInfo(),200)"><div class="hi-top"><div><span class="hi-name">'+it.name+'</span> <span class="hi-code">'+it.code+'</span></div><span class="hi-profit '+cls+'">'+sg+'¥'+fmtMoney(it.profit)+'</span></div><div class="hi-detail"><span>持仓 <span>'+it.shares+'股</span></span><span>成本 <span>¥'+fmt(it.avgCost)+'</span></span><span>现价 <span>¥'+fmt(it.price)+'</span></span><span>收益率 <span class="'+cls+'">'+sg+fmt(it.profitPct)+'%</span></span></div></div>';
  });
  list.innerHTML=html;
}
function resetAccount(){
  if(!confirm('确定重置账户？'))return;
  stopTimers();
  state.balance=900000;state.holdings={};state.timer=60;state.crashed=false;
  state.resetCount++;
  document.body.className='';
  document.getElementById('header-balance').style.color='var(--grn)';
  // 重新生成K线，价格回到基准附近
  for(let code in STOCKS){
    state.klines[code]=generateKlines(code);
    state.prices[code]=STOCKS[code].base*(0.8+Math.random()*0.4);
  }
  saveUserData();updateAll();
  startTimers();
  toast('✅ 账户已重置，60秒倒计时开始','success');
}

function updateAll(){
  document.getElementById('header-balance').textContent='¥'+fmtMoney(state.balance);
  renderStockList();renderChart();renderTradeInfo();renderHoldings();
}

// ============ 闪屏 ============
function triggerFlash(color){
  let el=document.getElementById('chart-flash');
  el.classList.remove('green','red');void el.offsetWidth;el.classList.add(color);
}

// ============ Toast ============
function toast(msg,type){
  let el=document.getElementById('toast');el.textContent=msg;el.className='toast '+type;el.style.display='block';
  clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',type==='crash'?5000:2500);
}

// 键盘
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&document.activeElement===document.getElementById('shares-input'))executeTrade();
});

// ============ 初始化 ============
function startTimers(){
  // K线每1秒跳动一次，慢慢涨
  state.tickId=setInterval(tickAllPrices,1000);
  startCountdown();
}
function initApp(){
  for(let code in STOCKS){
    state.klines[code]=generateKlines(code);
    if(!state.prices[code])state.prices[code]=STOCKS[code].base*(0.8+Math.random()*0.4);
  }
  document.body.className='';
  document.getElementById('header-balance').style.color='var(--grn)';
  renderStockList();renderChart();renderTradeInfo();renderHoldings();
  document.getElementById('header-balance').textContent='¥'+fmtMoney(state.balance);
  updateTimerDisplay();
  if(!state.crashed)startTimers();
  else updateAll();
}

// 启动
(function(){
  let lastUser=localStorage.getItem('ms3_last_user');
  if(lastUser){
    let users=getUsers();
    if(users[lastUser]){
      state.currentUser=lastUser;
      let data=loadUserData(lastUser);
      if(data){state.balance=data.balance||900000;state.holdings=data.holdings||{};state.timer=data.timer||60;state.crashed=data.crashed||false;}
      else{state.balance=900000;state.holdings={};state.timer=60;state.crashed=false;}
      document.getElementById('header-user').textContent=lastUser;
      initApp();
      saveUserData();
      return;
    }
  }
  showAuth('login');
})();
</script>
