<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>枫叶炒股</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root{
  --bg:#0a0f1a;
  --card:#111827;
  --card2:#161e2e;
  --bd:#1e2d3d;
  --tx:#e2e8f0;
  --sub:#64748b;
  --acc:#f59e0b;
  --acc2:#d97706;
  --red:#ef4444;
  --grn:#10b981;
  --blu:#3b82f6;
  --nav-h:60px;
  --hd-h:48px;
  --safe:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);
  color:var(--tx);
  height:100vh;
  height:100dvh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
}

/* ===== 顶部栏 ===== */
.header{
  height:var(--hd-h);
  min-height:var(--hd-h);
  background:var(--card);
  border-bottom:1px solid var(--bd);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  z-index:10;
  flex-shrink:0;
}
.header .logo{
  font-size:15px;
  font-weight:800;
  background:linear-gradient(135deg,var(--acc),#fbbf24);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.header .right{
  display:flex;
  align-items:center;
  gap:10px;
}
.header .bal{
  font-size:13px;
  font-weight:700;
  color:var(--grn);
}
.header .user{
  font-size:11px;
  color:var(--sub);
  cursor:pointer;
  padding:4px 10px;
  border:1px solid var(--bd);
  border-radius:14px;
  transition:all .2s;
}
.header .user:active{color:var(--acc);border-color:var(--acc)}

/* ===== 主区域 ===== */
.main{flex:1;overflow:hidden;position:relative}
.page{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  display:none;
  flex-direction:column;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.page.active{display:flex}

/* ===== 行情页 ===== */
.market-wrap{flex:1;display:flex;flex-direction:column;min-height:0}
.stock-scroll{
  display:flex;
  gap:8px;
  padding:10px 12px;
  overflow-x:auto;
  flex-shrink:0;
  scrollbar-width:none;
}
.stock-scroll::-webkit-scrollbar{display:none}
.stock-chip{
  flex:0 0 auto;
  min-width:90px;
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:12px;
  padding:10px 12px;
  cursor:pointer;
  text-align:center;
  transition:all .15s;
  position:relative;
  overflow:hidden;
}
.stock-chip:active{transform:scale(.96)}
.stock-chip.selected{border-color:var(--acc);background:#1a1f2e}
.stock-chip .name{font-size:12px;font-weight:600;margin-bottom:2px;position:relative;z-index:1}
.stock-chip .price{font-size:15px;font-weight:700;position:relative;z-index:1}
.stock-chip .change{font-size:10px;position:relative;z-index:1}
.stock-chip .bubble-bar{
  position:absolute;bottom:0;left:0;
  height:3px;background:var(--grn);
  transition:all .3s;
  border-radius:0 0 11px 11px;
}
.stock-chip .bubble-bar.warn{background:var(--acc)}
.stock-chip .bubble-bar.danger{background:var(--red);animation:blink .5s infinite}
@keyframes blink{50%{opacity:.3}}

.chart-area{flex:1;min-height:200px;position:relative}
#chart{width:100%;height:100%}
.chart-flash{
  position:absolute;top:0;left:0;
  width:100%;height:100%;
  background:rgba(239,68,68,.12);
  pointer-events:none;opacity:0;
  transition:opacity .1s;
  z-index:2;
}
.chart-flash.on{opacity:1;animation:flashOut .6s ease-out forwards}
@keyframes flashOut{to{opacity:0}}

.range-bar{
  display:flex;gap:4px;
  padding:6px 12px 10px;
  flex-shrink:0;
}
.range-bar b{
  padding:5px 16px;
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:16px;
  color:var(--sub);
  font-size:11px;
  cursor:pointer;
  transition:all .15s;
}
.range-bar b.active{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}

.up{color:var(--red)}.down{color:var(--grn)}

/* ===== 交易页 ===== */
.trade-pg{padding:14px}
.stock-info{
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:14px;
  padding:18px;
  margin-bottom:12px;
}
.stock-info .si-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:4px;
}
.stock-info .si-name{font-size:17px;font-weight:700}
.stock-info .si-price{
  font-size:32px;
  font-weight:800;
  transition:color .3s;
}
.stock-info .si-change{font-size:12px;margin-left:6px}
.stock-info .si-detail{
  display:flex;justify-content:space-between;
  font-size:11px;color:var(--sub);
  margin-top:10px;padding-top:10px;
  border-top:1px solid var(--bd);
}
.stock-info .si-detail span{color:var(--tx);font-weight:600}

.bubble-gauge{
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:14px;
  padding:12px 16px;
  margin-bottom:12px;
}
.bubble-gauge .bg-label{
  display:flex;justify-content:space-between;
  font-size:11px;margin-bottom:6px;
}
.bubble-gauge .bg-label .l{color:var(--sub)}
.bubble-gauge .bg-label .r{font-weight:700}
.bubble-gauge .bg-track{
  height:6px;background:var(--bg);
  border-radius:3px;overflow:hidden;
}
.bubble-gauge .bg-fill{
  height:100%;border-radius:3px;
  transition:width .5s,background .5s;
  background:var(--grn);
}
.bubble-gauge .bg-fill.warn{background:var(--acc)}
.bubble-gauge .bg-fill.danger{background:var(--red);animation:blink .5s infinite}
.bubble-gauge .bg-warn{
  font-size:10px;margin-top:6px;
  text-align:center;font-weight:700;
  display:none;
}
.bubble-gauge .bg-warn.show{display:block;animation:blink .5s infinite}

.trade-tabs{display:flex;gap:0;margin-bottom:12px}
.trade-tabs b{
  flex:1;padding:11px;
  border:1px solid var(--bd);
  background:var(--bg);
  color:var(--tx);
  font-size:14px;font-weight:600;
  cursor:pointer;text-align:center;
  transition:all .15s;
}
.trade-tabs b:first-child{border-radius:10px 0 0 10px}
.trade-tabs b:last-child{border-radius:0 10px 10px 0}
.trade-tabs b.active.buy{background:var(--red);color:#fff;border-color:var(--red)}
.trade-tabs b.active.sell{background:var(--grn);color:#fff;border-color:var(--grn)}

.trade-form{
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:14px;
  padding:18px;
}
.trade-form label{display:block;font-size:12px;color:var(--sub);margin-bottom:8px}
.trade-form .input-row{
  display:flex;gap:8px;align-items:center;
  margin-bottom:8px;
}
.trade-form .input-row input{
  flex:1;padding:11px 14px;
  background:var(--bg);
  border:1px solid var(--bd);
  border-radius:10px;
  color:var(--tx);font-size:16px;
  outline:none;
  transition:border-color .2s;
}
.trade-form .input-row input:focus{border-color:var(--acc)}
.trade-form .quick-btn{
  padding:5px 10px;
  background:var(--bg);
  border:1px solid var(--bd);
  border-radius:6px;
  color:var(--sub);
  font-size:10px;cursor:pointer;
  white-space:nowrap;
}
.trade-form .cost-hint{font-size:11px;color:var(--sub);margin-bottom:12px;min-height:16px}
.trade-form .submit-btn{
  width:100%;padding:13px;
  border:none;border-radius:10px;
  font-size:16px;font-weight:700;
  cursor:pointer;color:#fff;
  transition:all .15s;
}
.trade-form .submit-btn:active{transform:scale(.98);opacity:.85}
.trade-form .submit-btn.buy{background:var(--red)}
.trade-form .submit-btn.sell{background:var(--grn)}

/* ===== 持仓页 ===== */
.holdings-pg{padding:14px}
.overview{
  display:flex;gap:8px;
  margin-bottom:14px;
}
.overview .ov-card{
  flex:1;
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:10px;
  padding:12px;
  text-align:center;
}
.overview .ov-card .ov-label{font-size:10px;color:var(--sub);margin-bottom:4px}
.overview .ov-card .ov-value{font-size:17px;font-weight:700}

.holding-item{
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:10px;
  padding:14px;
  margin-bottom:8px;
  cursor:pointer;
  transition:all .15s;
}
.holding-item:active{background:var(--card2)}
.holding-item .hi-top{
  display:flex;justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}
.holding-item .hi-name{font-size:14px;font-weight:700}
.holding-item .hi-code{font-size:10px;color:var(--sub)}
.holding-item .hi-profit{font-size:14px;font-weight:700}
.holding-item .hi-detail{
  display:flex;justify-content:space-between;
  font-size:11px;color:var(--sub);
}
.holding-item .hi-detail span{color:var(--tx)}

.empty-state{
  text-align:center;
  padding:50px 20px;
  color:var(--sub);
}
.empty-state .empty-icon{font-size:40px;margin-bottom:10px}
.empty-state .empty-text{font-size:14px}

.reset-btn{
  display:block;width:100%;
  margin-top:12px;
  padding:12px;
  background:transparent;
  border:1px solid var(--red);
  border-radius:10px;
  color:var(--red);
  font-size:14px;cursor:pointer;
  text-align:center;font-weight:600;
}

/* ===== 底部导航 ===== */
.navbar{
  height:var(--nav-h);
  min-height:var(--nav-h);
  background:var(--card);
  border-top:1px solid var(--bd);
  display:flex;
  z-index:10;
  flex-shrink:0;
  padding-bottom:var(--safe);
}
.nav-item{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  cursor:pointer;
  color:var(--sub);
  transition:all .15s;
  position:relative;
}
.nav-item:active{opacity:.7}
.nav-item.active{color:var(--acc)}
.nav-item .nav-icon{font-size:22px;line-height:1}
.nav-item .nav-label{font-size:10px;font-weight:500}
.nav-item.active::after{
  content:'';
  position:absolute;
  top:0;left:50%;
  transform:translateX(-50%);
  width:24px;height:3px;
  background:var(--acc);
  border-radius:0 0 3px 3px;
}

/* ===== 登录弹层 ===== */
.auth-overlay{
  position:fixed;top:0;left:0;
  width:100%;height:100%;
  background:rgba(2,6,14,.95);
  z-index:9999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.auth-overlay.show{display:flex}
.auth-card{
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:20px;
  padding:32px 24px;
  width:100%;
  max-width:360px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  animation:authIn .35s ease-out;
}
@keyframes authIn{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.auth-card .auth-title{
  font-size:24px;font-weight:800;
  text-align:center;
  margin-bottom:6px;
  background:linear-gradient(135deg,var(--acc),#fbbf24);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.auth-card .auth-sub{
  font-size:13px;color:var(--sub);
  text-align:center;
  margin-bottom:24px;
  line-height:1.5;
}
.auth-card .auth-fields{
  display:flex;flex-direction:column;
  gap:12px;
}
.auth-card .auth-fields input{
  width:100%;
  padding:14px 16px;
  background:var(--bg);
  border:1px solid var(--bd);
  border-radius:12px;
  color:var(--tx);
  font-size:16px;
  outline:none;
  transition:border-color .2s;
}
.auth-card .auth-fields input:focus{border-color:var(--acc)}
.auth-card .auth-fields input::placeholder{color:var(--sub);font-size:14px}
.auth-card .captcha-row{
  display:flex;gap:10px;
  align-items:center;
}
.auth-card .captcha-row input{flex:1}
.auth-card .captcha-display{
  background:linear-gradient(135deg,#1a1f2e,#0f172a);
  border:1px solid var(--bd);
  border-radius:10px;
  padding:12px 14px;
  font-size:24px;font-weight:900;
  letter-spacing:4px;
  color:var(--acc);
  cursor:pointer;
  min-width:100px;text-align:center;
  user-select:none;
  font-family:'Courier New',monospace;
  text-decoration:line-through;
  flex-shrink:0;
}
.auth-card .auth-btn{
  width:100%;padding:14px;
  border:none;border-radius:12px;
  font-size:16px;font-weight:700;
  cursor:pointer;
  color:#000;
  background:linear-gradient(135deg,var(--acc),#fbbf24);
  transition:all .15s;
  margin-top:4px;
  letter-spacing:2px;
}
.auth-card .auth-btn:active{transform:scale(.98);opacity:.85}
.auth-card .auth-switch{
  text-align:center;
  font-size:13px;
  color:var(--sub);
  margin-top:18px;
  cursor:pointer;
}
.auth-card .auth-switch span{color:var(--blu);text-decoration:underline;font-weight:600}

/* ===== Toast ===== */
.toast{
  position:fixed;top:56px;left:50%;
  transform:translateX(-50%);
  padding:10px 20px;
  border-radius:10px;
  font-size:13px;font-weight:600;
  z-index:9998;
  animation:toastIn .3s;
  pointer-events:none;
  white-space:nowrap;
  max-width:90vw;
  overflow:hidden;
  text-overflow:ellipsis;
}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.toast.success{background:#0a2e1a;border:1px solid var(--grn);color:var(--grn)}
.toast.error{background:#2e0a0a;border:1px solid var(--red);color:var(--red)}
.toast.warning{background:#2e1f0a;border:1px solid var(--acc);color:var(--acc)}
.toast.crash{background:#3d0000;border:1px solid var(--red);color:var(--red);font-size:16px;padding:14px 24px}

/* 价格跳动 */
@keyframes jumpUp{0%{transform:scale(1)}30%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes jumpDown{0%{transform:scale(1)}30%{transform:scale(.82)}100%{transform:scale(1)}}
.jump-up{animation:jumpUp .4s ease-out}
.jump-down{animation:jumpDown .4s ease-out}

/* 桌面端 */
@media(min-width:768px){
  .market-wrap{flex-direction:row}
  .stock-scroll{
    flex-direction:column;
    width:200px;min-width:200px;max-width:200px;
    border-right:1px solid var(--bd);
    overflow-y:auto;overflow-x:hidden;
    padding:8px;gap:4px;
  }
  .stock-chip{min-width:auto;text-align:left;padding:10px 14px}
  .chart-area{min-height:380px}
  .trade-pg,.holdings-pg{max-width:460px;margin:0 auto}
}
</style>
</head>
<body>

<!-- 登录弹层 -->
<div class="auth-overlay" id="auth-overlay">
  <div class="auth-card" id="auth-card"></div>
</div>

<!-- 顶部栏 -->
<div class="header">
  <div class="logo">🍁 枫叶炒股</div>
  <div class="right">
    <div class="bal" id="header-balance">¥900,000.00</div>
    <div class="user" id="header-user" onclick="doLogout()"></div>
  </div>
</div>

<!-- 主内容 -->
<div class="main">
  <!-- 行情 -->
  <div class="page active" id="page-market">
    <div class="market-wrap">
      <div class="stock-scroll" id="stock-list"></div>
      <div class="chart-area">
        <div id="chart"></div>
        <div class="chart-flash" id="chart-flash"></div>
      </div>
      <div class="range-bar">
        <b class="active" onclick="setRange(30,this)">1月</b>
        <b onclick="setRange(60,this)">2月</b>
        <b onclick="setRange(90,this)">3月</b>
        <b onclick="setRange(200,this)">全部</b>
      </div>
    </div>
  </div>

  <!-- 交易 -->
  <div class="page" id="page-trade">
    <div class="trade-pg">
      <div class="stock-info" id="stock-info"></div>
      <div class="bubble-gauge" id="bubble-gauge">
        <div class="bg-label"><span class="l">📊 泡沫指数</span><span class="r" id="bubble-val">0%</span></div>
        <div class="bg-track"><div class="bg-fill" id="bubble-fill" style="width:0%"></div></div>
        <div class="bg-warn" id="bubble-warn"></div>
      </div>
      <div class="trade-tabs">
        <b class="active buy" onclick="setAction('buy')">买 入</b>
        <b class="sell" onclick="setAction('sell')">卖 出</b>
      </div>
      <div class="trade-form">
        <label>交易股数</label>
        <div class="input-row">
          <input type="number" id="shares-input" value="10" min="1" oninput="updateCost()">
          <span class="quick-btn" onclick="setShares(1)">1</span>
          <span class="quick-btn" onclick="setShares(10)">10</span>
          <span class="quick-btn" onclick="setShares(100)">100</span>
          <span class="quick-btn" onclick="setShares('max')">最大</span>
        </div>
        <div class="cost-hint" id="cost-hint"></div>
        <div class="submit-btn buy" id="submit-btn" onclick="executeTrade()">买 入</div>
      </div>
    </div>
  </div>

  <!-- 持仓 -->
  <div class="page" id="page-holdings">
    <div class="holdings-pg">
      <div class="overview">
        <div class="ov-card"><div class="ov-label">总资产</div><div class="ov-value" style="color:var(--blu)" id="ov-total">¥900,000.00</div></div>
        <div class="ov-card"><div class="ov-label">持仓市值</div><div class="ov-value" style="color:var(--acc)" id="ov-market">¥0.00</div></div>
        <div class="ov-card"><div class="ov-label">总盈亏</div><div class="ov-value" id="ov-pnl">¥0.00</div></div>
      </div>
      <div id="holdings-list"></div>
      <div class="reset-btn" onclick="resetAccount()">🔄 重置账户</div>
    </div>
  </div>
</div>

<!-- 底部导航 -->
<div class="navbar">
  <div class="nav-item active" data-page="market" onclick="switchPage('market')">
    <span class="nav-icon">📈</span><span class="nav-label">行情</span>
  </div>
  <div class="nav-item" data-page="trade" onclick="switchPage('trade')">
    <span class="nav-icon">💹</span><span class="nav-label">交易</span>
  </div>
  <div class="nav-item" data-page="holdings" onclick="switchPage('holdings')">
    <span class="nav-icon">📋</span><span class="nav-label">持仓</span>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast" style="display:none"></div>

<script>
// ============ 股票定义 ============
const STOCKS = {
  '000001':{name:'平安银行',base:12.5},
  '600519':{name:'贵州茅台',base:1680},
  '000858':{name:'五粮液',base:156.8},
  '601318':{name:'中国平安',base:45.2},
  '600036':{name:'招商银行',base:38.6},
  '300750':{name:'宁德时代',base:210.5},
  '002594':{name:'比亚迪',base:268.3},
  '688981':{name:'中芯国际',base:52.4},
  '300059':{name:'东方财富',base:18.9},
  '600276':{name:'恒瑞医药',base:48.7}
};

// ============ 全局状态 ============
let state = {
  prices: {},        // {code: number}
  klines: {},        // {code: [{dt,o,c,h,l,v}]}
  balance: 900000,
  holdings: {},      // {code: {shares, avgCost}}
  bubbles: {},       // {code: {bought, sold}}
  selected: '600519',
  range: 30,
  action: 'buy',
  currentUser: null,
  chart: null
};

// ============ 工具函数 ============
function gauss(mean,std){
  let u=0,v=0;
  while(u===0)u=Math.random();
  while(v===0)v=Math.random();
  return mean+std*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}
function hashPassword(pw){
  let h=0;
  for(let i=0;i<pw.length;i++){h=((h<<5)-h)+pw.charCodeAt(i);h|=0;}
  return h.toString(36)+'_'+pw.length;
}
function fmt(n){return n.toFixed(2)}
function fmtMoney(n){
  let parts=n.toFixed(2).split('.');
  parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return parts.join('.');
}
function pct(a,b){return b===0?0:((a-b)/b*100);}

// ============ 泡沫/收割计算 ============
// 泡沫指数：净买入占总持仓的比例，越买越涨
function getBubblePct(code){
  let b=state.bubbles[code]||{bought:0,sold:0};
  let net=b.bought-b.sold;
  if(net<=0)return 0;
  // 涨得快，让用户上头
  return Math.min(100,Math.round(net*2));
}
function getBubbleLevel(code){
  let p=getBubblePct(code);
  if(p>=100)return'crash';  // 满了就收割
  if(p>=85)return'danger';
  if(p>=60)return'warn';
  return'safe';
}
// 价格增长：买得越多涨得越猛，诱人得很
function calcPrice(code){
  let base=STOCKS[code].base;
  let b=state.bubbles[code]||{bought:0,sold:0};
  let net=b.bought-b.sold;
  if(net<=0)return base;
  // 每净买1股涨2%，最高可涨到基础价的20倍
  let mult=Math.min(20,1+net*0.02);
  return +(base*mult).toFixed(2);
}
// 检查用户是否重仓押注（总资产的占比）
function getUserExposure(code){
  let totalValue=state.balance;
  for(let c in state.holdings){
    let h=state.holdings[c];
    if(h.shares>0)totalValue+=h.shares*state.prices[c];
  }
  let h=state.holdings[code];
  if(!h||h.shares<=0)return 0;
  let positionValue=h.shares*state.prices[code];
  return totalValue>0?positionValue/totalValue:0;
}

let captchaAnswer=0;
function genCaptcha(){
  let a=Math.floor(Math.random()*20)+1;
  let b=Math.floor(Math.random()*20)+1;
  let ops=['+','-','×'],op=ops[Math.floor(Math.random()*3)];
  if(op==='+')captchaAnswer=a+b;
  else if(op==='-')captchaAnswer=a-b;
  else captchaAnswer=a*b;
  return a+' '+op+' '+b+' = ?';
}

// ============ K线数据生成 ============
function generateKlines(code){
  let s=STOCKS[code],cur=s.base*(0.7+Math.random()*0.6),klines=[],now=new Date();
  for(let i=200;i>0;i--){
    let d=new Date(now);
    d.setDate(d.getDate()-i);
    let ds=d.toISOString().split('T')[0];
    let ch=gauss(0,cur*0.02);
    let o=cur,c=cur+ch;
    let h=Math.max(o,c)*(1+Math.random()*0.02);
    let l=Math.min(o,c)*(1-Math.random()*0.02);
    let v=Math.floor(100000+Math.random()*4900000);
    klines.push({dt:ds,o:+o.toFixed(2),c:+c.toFixed(2),h:+h.toFixed(2),l:+l.toFixed(2),v:v});
    cur=c;
  }
  return klines;
}

          '涨跌:<span style="color:'+cl+'">'+s+chg+'%</span><br/>'+

      }

    grid:[{left:'8%',right:'4%',top:'5%',height:'62%'},{left:'8%',right:'4%',top:'74%',height:'18%'}],

// ============ 核心交易（收割版） ============
function executeTrade(){
  let code=state.selected;
  let s=STOCKS[code];
  let price=state.prices[code];
  let sh=parseInt(document.getElementById('shares-input').value)||0;
  if(sh<=0)return toast('请输入有效股数','error');

  if(!state.bubbles[code])state.bubbles[code]={bought:0,sold:0};

  if(state.action==='buy'){
    let cost=price*sh;
    if(state.balance<cost)return toast('余额不足！需 ¥'+fmtMoney(cost),'error');

    let oldPrice=price;
    state.balance-=cost;
    if(!state.holdings[code])state.holdings[code]={shares:0,avgCost:0};
    let h=state.holdings[code];
    let totalCost=h.shares*h.avgCost+cost;
    h.shares+=sh;
    h.avgCost=totalCost/h.shares;

    state.bubbles[code].bought+=sh;
    let newPrice=calcPrice(code);
    state.prices[code]=newPrice;

    updateKline(code,oldPrice,newPrice,sh);
    animatePrice(newPrice>oldPrice);

    // 收割逻辑：当用户重仓（>50%总资产）且泡沫满了，直接砸盘
    let exposure=getUserExposure(code);
    let bubblePct=getBubblePct(code);
    if(bubblePct>=100 && exposure>=0.5){
      triggerCrash(code,cost,sh);
      return;
    }

    let newLvl=getBubbleLevel(code);
    if(newLvl==='crash'){
      toast('📈 涨势如虹！继续加仓！','success');
    }else if(newLvl==='danger'){
      toast('🚀 股价飙升中！','success');
    }else{
      toast('✅ 买入成功！'+s.name+' '+sh+'股 @ ¥'+fmt(newPrice)+' (+'+(newPrice-oldPrice>=0?'+':'')+fmt(newPrice-oldPrice)+')','success');
    }
  }else{
    if(!state.holdings[code]||state.holdings[code].shares<sh)return toast('持仓不足！','error');

    let oldPrice=price;
    state.balance+=price*sh;
    state.holdings[code].shares-=sh;
    if(state.holdings[code].shares<=0)delete state.holdings[code];

    state.bubbles[code].sold+=sh;
    let newPrice=calcPrice(code);
    state.prices[code]=newPrice;

    updateKline(code,oldPrice,newPrice,-sh);
    animatePrice(newPrice>oldPrice);

    toast('✅ 卖出成功！'+s.name+' '+sh+'股 @ ¥'+fmt(newPrice),'success');
  }

  saveUserData();
  updateAll();
}

function triggerCrash(code,cost,sh){
  let s=STOCKS[code];
  let oldPrice=state.prices[code];

  // 先扣钱
  state.balance-=cost;
  if(!state.holdings[code])state.holdings[code]={shares:0,avgCost:0};
  let h=state.holdings[code];
  let tc=h.shares*h.avgCost+cost;
  h.shares+=sh;
  h.avgCost=tc/h.shares;
  state.bubbles[code].bought+=sh;

  // 砸盘：跌到当前价的 2%~5%，几乎归零
  let crashRatio=0.02+Math.random()*0.03;
  let crashPrice=+(oldPrice*crashRatio).toFixed(2);
  // 最低不能低于基础价的 1%
  crashPrice=Math.max(STOCKS[code].base*0.01,crashPrice);
  state.prices[code]=crashPrice;
  state.bubbles[code]={bought:0,sold:0};

  updateKline(code,oldPrice,crashPrice,sh);
  triggerFlash();

  // 计算用户亏了多少
  let loss=0;
  for(let c in state.holdings){
    let hh=state.holdings[c];
    if(hh.shares>0)loss+=hh.shares*(oldPrice-state.prices[c]);
  }

  toast('💥 庄家砸盘！'+s.name+' 从 ¥'+fmt(oldPrice)+' 暴跌至 ¥'+fmt(crashPrice)+'！血本无归！','crash');

  saveUserData();
  updateAll();
}

function updateKline(code,oldPrice,newPrice,shares){
  let k=state.klines[code];
  if(!k||k.length===0)return;
  let last=k[k.length-1];
  last.c=newPrice;
  last.h=Math.max(last.h,newPrice,oldPrice);
  last.l=Math.min(last.l,newPrice,oldPrice);
  last.v+=Math.abs(shares)*10000;
}

}

// ============ 持仓 ============
function renderHoldings(){
  let totalValue=state.balance,marketValue=0,items=[];
  for(let code in state.holdings){
    let h=state.holdings[code];
    if(h.shares<=0)continue;
    let price=state.prices[code];
    let mk=h.shares*price;
    let cost=h.shares*h.avgCost;
    let profit=mk-cost;
    let profitPct=cost>0?(profit/cost*100):0;
    totalValue+=mk;
    marketValue+=mk;
    items.push({code,name:STOCKS[code].name,shares:h.shares,avgCost:h.avgCost,price,market:mk,profit,profitPct});
  }
  let totalPnl=totalValue-900000;
  document.getElementById('ov-total').textContent='¥'+fmtMoney(totalValue);
  document.getElementById('ov-market').textContent='¥'+fmtMoney(marketValue);
  let pnlEl=document.getElementById('ov-pnl');
  pnlEl.textContent=(totalPnl>=0?'+':'')+'¥'+fmt(totalPnl);
  pnlEl.className='ov-value '+(totalPnl>=0?'up':'down');

  let list=document.getElementById('holdings-list');
  if(!items.length){
    list.innerHTML='<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">暂无持仓</div><div style="font-size:11px;margin-top:6px">去交易页买入股票吧</div></div>';
    return;
  }
  let html='';
  items.forEach(it=>{
    let cls=it.profit>=0?'up':'down',sg=it.profit>=0?'+':'';
    html+=
      '<div class="holding-item" onclick="state.selected=\''+it.code+'\';switchPage(\'trade\');setTimeout(()=>{renderTradeInfo();renderBubbleGauge();},200)">'+
      '<div class="hi-top"><div><span class="hi-name">'+it.name+'</span> <span class="hi-code">'+it.code+'</span></div>'+
      '<span class="hi-profit '+cls+'">'+sg+'¥'+fmt(it.profit)+'</span></div>'+
      '<div class="hi-detail">'+
      '<span>持仓 <span>'+it.shares+'股</span></span>'+
      '<span>成本 <span>¥'+fmt(it.avgCost)+'</span></span>'+
      '<span>现价 <span>¥'+fmt(it.price)+'</span></span>'+
      '<span>收益率 <span class="'+cls+'">'+sg+fmt(it.profitPct)+'%</span></span>'+
      '</div></div>';
  });
  list.innerHTML=html;
}
function resetAccount(){
  if(!confirm('确定重置账户？所有持仓和交易记录将被清除。'))return;
  state.balance=900000;
  state.holdings={};
  state.bubbles={};
  saveUserData();
  updateAll();
  toast('✅ 账户已重置','success');
}

// ============ 同步更新 ============
function updateAll(){
  updateStockPrices();
  document.getElementById('header-balance').textContent='¥'+fmtMoney(state.balance);
  renderTradeInfo();
  renderBubbleGauge();
  renderHoldings();
  renderChart();
  renderStockList();
}

// ============ Toast ============
function toast(msg,type){
  let el=document.getElementById('toast');
  el.textContent=msg;
  el.className='toast '+type;
  el.style.display='block';
  clearTimeout(el._timer);
  el._timer=setTimeout(()=>el.style.display='none',type==='crash'?4000:2500);
}

// ============ 键盘支持 ============
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&document.activeElement===document.getElementById('shares-input'))executeTrade();
});

// ============ 初始化 ============
function initApp(){
  for(let code in STOCKS){
    state.klines[code]=generateKlines(code);
    state.prices[code]=calcPrice(code);
  }
  renderStockList();
  renderChart();
  renderTradeInfo();
  renderBubbleGauge();
  renderHoldings();
  document.getElementById('header-balance').textContent='¥'+fmtMoney(state.balance);
}

// 启动
(function(){
  let lastUser=localStorage.getItem('ms2_last_user');
  if(lastUser){
    let users=getUsers();
    if(users[lastUser]){
      state.currentUser=lastUser;
      let data=loadUserData(lastUser);
      if(data){state.balance=data.balance||900000;state.holdings=data.holdings||{};state.bubbles=data.bubbles||{};}
      document.getElementById('header-user').textContent=lastUser;
      initApp();
      return;
    }
  }
  showAuth('login');
})();
</script>
