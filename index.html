<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>枫叶炒股 - 实时模拟交易</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js">
</script>
<style>
:root{
  --bg:#0d1117;--card:#161b22;--border:#30363d;--text:#c9d1d9;
  --sub:#8b949e;--red:#e15241;--green:#3fb950;--orange:#ff6b35;
  --blue:#58a6ff;--nav-h:64px;--header-h:48px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);
  height:100vh;height:100dvh;overflow:hidden;
  display:flex;flex-direction:column;
  -webkit-tap-highlight-color:transparent;user-select:none;
}
.header{
  height:var(--header-h);min-height:var(--header-h);
  background:var(--card);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;z-index:10;
}
.header .logo{font-size:15px;font-weight:700;color:var(--orange)}
.header .balance{display:flex;align-items:center;gap:6px;font-size:13px}
.header .balance .blabel{color:var(--sub);font-size:11px}
.header .balance .bval{color:var(--green);font-weight:700;font-size:15px}

.main-content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:8px}
.page{display:none;flex-direction:column;min-height:100%}
.page.active{display:flex}

/* 行情页 */
.market-page{display:flex;flex-direction:column}
.stock-scroll{
  display:flex;gap:6px;padding:8px 10px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;flex-shrink:0;
}
.stock-scroll::-webkit-scrollbar{display:none}
.stock-card{
  flex:0 0 auto;min-width:90px;background:var(--card);
  border:1px solid var(--border);border-radius:8px;
  padding:8px 10px;cursor:pointer;transition:all .15s;text-align:center;
}
.stock-card:active{transform:scale(.96)}
.stock-card.selected{border-color:var(--orange);background:#1a2332}
.stock-card .sc-name{font-size:12px;font-weight:600;white-space:nowrap}
.stock-card .sc-price{font-size:15px;font-weight:700;margin:3px 0}
.stock-card .sc-chg{font-size:10px}
.up{color:var(--red)}.down{color:var(--green)}

.chart-wrap{flex:1;min-height:280px;position:relative}
#kline-chart{width:100%;height:100%}

.time-tabs{display:flex;gap:4px;padding:4px 10px 8px;flex-shrink:0}
.time-tabs button{
  padding:4px 12px;background:var(--card);border:1px solid var(--border);
  border-radius:14px;color:var(--sub);font-size:11px;cursor:pointer;transition:all .15s;
}
.time-tabs button.active{background:var(--orange);color:#fff;border-color:var(--orange)}

/* 交易页 */
.trade-page{padding:12px}
.trade-stock-info{
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:14px;margin-bottom:12px;
}
.trade-stock-info .tsi-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.trade-stock-info .tsi-name{font-size:15px;font-weight:700}
.trade-stock-info .tsi-price{font-size:22px;font-weight:700}
.trade-stock-info .tsi-chg{font-size:12px}
.trade-stock-info .tsi-detail{
  display:flex;justify-content:space-between;font-size:11px;
  color:var(--sub);margin-top:6px;padding-top:8px;border-top:1px solid var(--border);
}
.trade-stock-info .tsi-detail span{color:var(--text);font-weight:600}

.trade-actions{display:flex;gap:0;margin-bottom:12px}
.trade-actions button{
  flex:1;padding:10px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;
}
.trade-actions button:first-child{border-radius:8px 0 0 8px}
.trade-actions button:last-child{border-radius:0 8px 8px 0}
.trade-actions button.active.buy-btn{background:var(--red);color:#fff;border-color:var(--red)}
.trade-actions button.active.sell-btn{background:var(--green);color:#fff;border-color:var(--green)}

.trade-form{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px}
.trade-form label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
.trade-form .input-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.trade-form .input-row input{
  flex:1;padding:10px 12px;background:var(--bg);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:16px;outline:none;
}
.trade-form .input-row input:focus{border-color:var(--orange)}
.trade-form .quick-btns{display:flex;gap:4px}
.trade-form .quick-btns button{
  padding:4px 8px;background:var(--bg);border:1px solid var(--border);
  border-radius:4px;color:var(--sub);font-size:10px;cursor:pointer;
}
.trade-form .calc-msg{font-size:11px;color:var(--sub);margin-bottom:10px;min-height:16px}
.trade-form .submit-btn{
  width:100%;padding:12px;border:none;border-radius:8px;
  font-size:16px;font-weight:700;cursor:pointer;transition:all .15s;color:#fff;
}
.trade-form .submit-btn.buy-submit{background:var(--red)}
.trade-form .submit-btn.sell-submit{background:var(--green)}
.trade-form .submit-btn:active{transform:scale(.98);opacity:.85}

/* 持仓页 */
.portfolio-page{padding:12px}
.portfolio-overview{display:flex;gap:8px;margin-bottom:12px}
.pov-card{
  flex:1;background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:10px;text-align:center;
}
.pov-card .lbl{font-size:10px;color:var(--sub);margin-bottom:3px}
.pov-card .val{font-size:16px;font-weight:700}
.pov-card .val.blue{color:var(--blue)}

.position-item{
  background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer;transition:all .15s;
}
.position-item:active{background:#1c2129}
.position-item .pi-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.position-item .pi-name{font-size:14px;font-weight:700}
.position-item .pi-code{font-size:10px;color:var(--sub)}
.position-item .pi-profit{font-size:14px;font-weight:700}
.position-item .pi-row{display:flex;justify-content:space-between;font-size:11px;color:var(--sub)}
.position-item .pi-row span{color:var(--text)}
.empty-state{text-align:center;padding:40px 20px;color:var(--sub)}
.empty-state .empty-icon{font-size:40px;margin-bottom:8px}

/* 我的页 */
.profile-page{padding:12px}
.profile-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}
.profile-card .pf-title{font-size:12px;color:var(--sub);margin-bottom:8px}
.profile-card .pf-stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.profile-card .pf-stat:last-child{border-bottom:none}
.profile-card .pf-stat .pf-label{color:var(--sub)}
.profile-card .pf-stat .pf-value{font-weight:600}

.reset-btn{
  width:100%;padding:12px;background:transparent;border:1px solid var(--red);
  border-radius:8px;color:var(--red);font-size:14px;cursor:pointer;margin-top:8px;transition:all .15s;
}
.reset-btn:active{background:rgba(225,82,65,.1)}

/* 底部导航 */
.bottom-nav{
  height:var(--nav-h);min-height:var(--nav-h);
  background:var(--card);border-top:1px solid var(--border);
  display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom,0);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;cursor:pointer;transition:all .15s;color:var(--sub);
}
.nav-item:active{opacity:.7}
.nav-item.active{color:var(--orange)}
.nav-item .nav-icon{font-size:20px;line-height:1}
.nav-item .nav-label{font-size:10px;font-weight:500}

/* Toast */
.toast{
  position:fixed;top:56px;left:50%;transform:translateX(-50%);
  padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;
  z-index:999;animation:toastIn .3s ease;pointer-events:none;
  white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;
}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.toast.success{background:#1a4332;border:1px solid var(--green);color:var(--green)}
.toast.error{background:#3d1f1a;border:1px solid var(--red);color:var(--red)}

/* 桌面端 */
@media(min-width:768px){
  body{flex-direction:row;flex-wrap:wrap}
  .header{width:100%;height:48px;min-height:48px}
  .main-content{width:100%;flex:1;display:flex;overflow:hidden}
  .page{flex-direction:row}
  .market-page{display:flex;flex-direction:row;width:100%}
  .stock-scroll{
    flex-direction:column;width:220px;min-width:220px;max-width:220px;
    border-right:1px solid var(--border);overflow-y:auto;overflow-x:hidden;padding:6px;gap:4px;
  }
  .stock-card{min-width:auto;text-align:left;padding:10px 12px}
  .chart-area-desktop{flex:1;display:flex;flex-direction:column;min-width:0}
  .chart-wrap{min-height:350px}
  .trade-page,.portfolio-page,.profile-page{width:100%;max-width:420px;padding:16px;margin:0 auto}
  .bottom-nav{width:100%}
}
</style>
</head>
<body>

<!-- 顶部栏 -->
<div class="header">
  <div class="logo">🍁 枫叶炒股</div>
  <div class="balance">
    <span class="blabel">💰</span>
    <span class="bval" id="top-balance">¥900.00</span>
  </div>
</div>

<!-- 主内容 -->
<div class="main-content">

  <!-- 行情页 -->
  <div class="page active" id="page-market">
    <div class="market-page">
      <div class="stock-scroll" id="stock-scroll"></div>
      <div class="chart-area-desktop">
        <div class="chart-wrap"><div id="kline-chart"></div></div>
        <div class="time-tabs">
          <button onclick="setKRange(30)" class="active">1月</button>
          <button onclick="setKRange(60)">2月</button>
          <button onclick="setKRange(90)">3月</button>
          <button onclick="setKRange(200)">全部</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 交易页 -->
  <div class="page" id="page-trade">
    <div class="trade-page">
      <div class="trade-stock-info" id="trade-info"></div>
      <div class="trade-actions">
        <button class="active buy-btn" onclick="setTradeAction('buy')">买入</button>
        <button class="sell-btn" onclick="setTradeAction('sell')">卖出</button>
      </div>
      <div class="trade-form">
        <label>交易股数</label>
        <div class="input-row">
          <input type="number" id="trade-shares" value="10" min="1" oninput="updateTradeCalc()">
          <div class="quick-btns">
            <button onclick="setShares(1)">1</button>
            <button onclick="setShares(10)">10</button>
            <button onclick="setShares(100)">100</button>
            <button onclick="setSharesMax()">最大</button>
          </div>
        </div>
        <div class="calc-msg" id="trade-calc"></div>
        <button class="submit-btn buy-submit" id="trade-submit" onclick="doTrade()">买入</button>
      </div>
    </div>
  </div>

  <!-- 持仓页 -->
  <div class="page" id="page-portfolio">
    <div class="portfolio-page">
      <div class="portfolio-overview">
        <div class="pov-card"><div class="lbl">总资产</div><div class="val blue" id="pv-total">¥900.00</div></div>
        <div class="pov-card"><div class="lbl">持仓市值</div><div class="val" id="pv-mktval" style="color:var(--orange)">¥0.00</div></div>
        <div class="pov-card"><div class="lbl">总盈亏</div><div class="val" id="pv-profit">¥0.00</div></div>
      </div>
      <div id="position-list"></div>
    </div>
  </div>

  <!-- 我的页 -->
  <div class="page" id="page-profile">
    <div class="profile-page">
      <div class="profile-card">
        <div class="pf-title">账户概览</div>
        <div class="pf-stat"><span class="pf-label">可用资金</span><span class="pf-value" style="color:var(--green)" id="pf-balance">¥900.00</span></div>
        <div class="pf-stat"><span class="pf-label">总资产</span><span class="pf-value" style="color:var(--blue)" id="pf-total">¥900.00</span></div>
        <div class="pf-stat"><span class="pf-label">持仓市值</span><span class="pf-value" id="pf-mktval">¥0.00</span></div>
        <div class="pf-stat"><span class="pf-label">持仓股票数</span><span class="pf-value" id="pf-count">0</span></div>
        <div class="pf-stat"><span class="pf-label">总盈亏</span><span class="pf-value" id="pf-profit">¥0.00</span></div>
      </div>
      <button class="reset-btn" onclick="resetAccount()">🔄 重置账户（恢复 ¥900）</button>
    </div>
  </div>
</div>

<!-- 底部导航 -->
<div class="bottom-nav">
  <div class="nav-item active" data-page="market" onclick="switchPage('market')">
    <span class="nav-icon">📈</span><span class="nav-label">行情</span>
  </div>
  <div class="nav-item" data-page="trade" onclick="switchPage('trade')">
    <span class="nav-icon">💹</span><span class="nav-label">交易</span>
  </div>
  <div class="nav-item" data-page="portfolio" onclick="switchPage('portfolio')">
    <span class="nav-icon">📋</span><span class="nav-label">持仓</span>
  </div>
  <div class="nav-item" data-page="profile" onclick="switchPage('profile')">
    <span class="nav-icon">👤</span><span class="nav-label">我的</span>
  </div>
</div>

<div class="toast" id="toast" style="display:none"></div>

<script>
// ==================== 股票数据 ====================
const STOCK_DEF = {
  "000001":{name:"平安银行",base:12.50,vol:0.003},
  "600519":{name:"贵州茅台",base:1680.00,vol:0.002},
  "000858":{name:"五粮液",base:156.80,vol:0.0025},
  "601318":{name:"中国平安",base:45.20,vol:0.002},
  "600036":{name:"招商银行",base:38.60,vol:0.002},
  "300750":{name:"宁德时代",base:210.50,vol:0.003},
  "002594":{name:"比亚迪",base:268.30,vol:0.0025},
  "688981":{name:"中芯国际",base:52.40,vol:0.004},
  "300059":{name:"东方财富",base:18.90,vol:0.0035},
  "600276":{name:"恒瑞医药",base:48.70,vol:0.0025},
};

// ==================== 全局状态 ====================
let stocks = {};
let klines = {};
let balance = 900;
let holdings = {};
let curStock = '600519';
let tradeAction = 'buy';
let kRange = 30;
let chart = null;
let tickCount = 0;

// ==================== 工具函数 ====================
function gauss(mean,std){
  let u=0,v=0;
  while(u===0)u=Math.random();
  while(v===0)v=Math.random();
  return mean+std*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}
function save(){
  localStorage.setItem('ms_balance',balance);
  localStorage.setItem('ms_holdings',JSON.stringify(holdings));
}
function load(){
  let b=localStorage.getItem('ms_balance');
  if(b!==null)balance=parseFloat(b);
  let h=localStorage.getItem('ms_holdings');
  if(h!==null)holdings=JSON.parse(h);
}
function daysAgo(n){let d=new Date();d.setDate(d.getDate()-n);return d;}

// ==================== 生成K线 ====================
function genKlines(code){
  let sd=STOCK_DEF[code],bp=sd.base,cur=bp*(0.7+Math.random()*0.6),kl=[],now=new Date();
  for(let i=200;i>0;i--){
    let d=new Date(now-daysAgo(i)),ds=d.toISOString().split('T')[0];
    let ch=gauss(0,cur*0.02),o=cur,c=cur+ch,h=Math.max(o,c)*(1+Math.random()*0.02),l=Math.min(o,c)*(1-Math.random()*0.02),v=Math.floor(100000+Math.random()*4900000);
    kl.push({date:ds,open:+o.toFixed(2),close:+c.toFixed(2),high:+h.toFixed(2),low:+l.toFixed(2),volume:v});
    cur=c;
  }
  return kl;
}

// ==================== 价格跳动 ====================
function tick(){
  tickCount++;
  for(let code in STOCK_DEF){
    let s=stocks[code],kl=klines[code],sd=STOCK_DEF[code],lc=kl[kl.length-1].close;
    let ch=gauss(0,lc*sd.vol);
    ch=Math.max(-lc*0.015,Math.min(lc*0.015,ch));
    let np=Math.max(0.01,+(lc+ch).toFixed(2));
    s.price=np;s.change=+(np-lc).toFixed(2);s.change_pct=+((np-lc)/lc*100).toFixed(2);

    // 更新最后一根K线
    let last=kl[kl.length-1];
    last.close=np;last.high=Math.max(last.high,np);last.low=Math.min(last.low,np);

    // 每60个tick(约90秒)新蜡烛
    if(tickCount%60===0){
      kl.push({date:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),open:np,close:np,high:np,low:np,volume:Math.floor(50000+Math.random()*200000)});
      if(kl.length>300)kl=kl.slice(-300);
    }
  }
  updateStockScroll();
  updateTradeInfo();
  updatePortfolioPage();
  updateProfilePage();
  updateBalance();
  refreshChart();
}
setInterval(tick,1500);

// ==================== 页面切换 ====================
function switchPage(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.querySelector('[data-page="'+page+'"]').classList.add('active');
  if(page==='market') setTimeout(()=>{if(chart)chart.resize();renderChart();},100);
  if(page==='trade') updateTradeInfo();
  if(page==='portfolio') updatePortfolioPage();
  if(page==='profile') updateProfilePage();
}

// ==================== 股票列表 ====================
function renderStockScroll(){
  let h='';
  for(let code in stocks){
    let s=stocks[code],cls=s.change_pct>=0?'up':'down',sg=s.change_pct>=0?'+':'',sel=code===curStock?' selected':'';
    h+=`<div class="stock-card${sel}" onclick="selectStock('${code}')"><div class="sc-name">${s.name}</div><div class="sc-price">${s.price.toFixed(2)}</div><div class="sc-chg ${cls}">${sg}${s.change_pct.toFixed(2)}%</div></div>`;
  }
  document.getElementById('stock-scroll').innerHTML=h;
}
function updateStockScroll(){
  let cards=document.querySelectorAll('.stock-card'),codes=Object.keys(stocks);
  cards.forEach((card,i)=>{
    if(i>=codes.length)return;
    let s=stocks[codes[i]],cls=s.change_pct>=0?'up':'down',sg=s.change_pct>=0?'+':'';
    card.querySelector('.sc-price').textContent=s.price.toFixed(2);
    let chg=card.querySelector('.sc-chg');
    chg.textContent=sg+s.change_pct.toFixed(2)+'%';chg.className='sc-chg '+cls;
  });
}
function selectStock(code){
  curStock=code;renderStockScroll();renderChart();updateTradeInfo();
}
function setKRange(days){
  kRange=days;
  document.querySelectorAll('.time-tabs button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  renderChart();
}

// ==================== K线图 ====================
function renderChart(){
  let dom=document.getElementById('kline-chart');
  if(!chart){chart=echarts.init(dom,'dark');window.addEventListener('resize',()=>{if(chart)chart.resize();});}
  let kl=(klines[curStock]||[]).slice(-kRange);
  if(kl.length===0)return;
  let dates=kl.map(d=>d.date),ohlc=kl.map(d=>[d.open,d.close,d.low,d.high]),vols=kl.map(d=>d.volume);
  chart.setOption({
    backgroundColor:'#0d1117',animation:false,
    tooltip:{trigger:'axis',axisPointer:{type:'cross'},backgroundColor:'#161b22',borderColor:'#30363d',textStyle:{color:'#c9d1d9',fontSize:11},
      formatter:function(p){if(!p||!p[0])return'';let d=p[0].data,c=((d[2]-d[1])/d[1]*100).toFixed(2),s=c>=0?'+':'',cl=c>=0?'#e15241':'#3fb950';return`<b>${p[0].axisValue}</b><br/>开:<span style="color:${cl}">${d[1].toFixed(2)}</span> 收:<span style="color:${cl}">${d[2].toFixed(2)}</span> 涨跌:<span style="color:${cl}">${s}${c}%</span><br/>高:${d[4].toFixed(2)} 低:${d[3].toFixed(2)} 量:${(p[1]?.data/10000).toFixed(0)}万手`;}},
    grid:[{left:'8%',right:'4%',top:'5%',height:'62%'},{left:'8%',right:'4%',top:'74%',height:'18%'}],
    xAxis:[{type:'category',data:dates,gridIndex:0,axisLine:{lineStyle:{color:'#30363d'}},axisLabel:{color:'#8b949e',fontSize:9}},{type:'category',data:dates,gridIndex:1,axisLine:{lineStyle:{color:'#30363d'}},axisLabel:{show:false}}],
    yAxis:[{type:'value',gridIndex:0,scale:true,splitLine:{lineStyle:{color:'#21262d'}},axisLabel:{color:'#8b949e',fontSize:9}},{type:'value',gridIndex:1,axisLabel:{color:'#8b949e',fontSize:8}}],
    series:[{name:'K线',type:'candlestick',xAxisIndex:0,yAxisIndex:0,data:ohlc,itemStyle:{color:'#e15241',color0:'#3fb950',borderColor:'#e15241',borderColor0:'#3fb950'}},{name:'量',type:'bar',xAxisIndex:1,yAxisIndex:1,data:vols,itemStyle:{color:function(p){let i=p.dataIndex;return ohlc[i][2]>=ohlc[i][1]?'#e15241':'#3fb950';}}}]
  },true);
}
function refreshChart(){
  if(!chart){renderChart();return;}
  let kl=(klines[curStock]||[]).slice(-kRange);
  if(kl.length===0)return;
  let dates=kl.map(d=>d.date),ohlc=kl.map(d=>[d.open,d.close,d.low,d.high]),vols=kl.map(d=>d.volume);
  chart.setOption({xAxis:[{data:dates},{data:dates}],series:[{data:ohlc},{data:vols}]});
}

// ==================== 交易 ====================
function setTradeAction(a){
  tradeAction=a;
  let btns=document.querySelectorAll('.trade-actions button');
  btns.forEach(b=>b.classList.remove('active'));
  if(a==='buy'){btns[0].classList.add('active');document.getElementById('trade-submit').className='submit-btn buy-submit';document.getElementById('trade-submit').textContent='买入';}
  else{btns[1].classList.add('active');document.getElementById('trade-submit').className='submit-btn sell-submit';document.getElementById('trade-submit').textContent='卖出';}
  updateTradeCalc();
}
function setShares(n){document.getElementById('trade-shares').value=n;updateTradeCalc();}
function setSharesMax(){
  let s=stocks[curStock];if(!s)return;
  if(tradeAction==='buy')document.getElementById('trade-shares').value=Math.floor(balance/s.price);
  else{let h=holdings[curStock];document.getElementById('trade-shares').value=h?h.shares:0;}
  updateTradeCalc();
}
function updateTradeCalc(){
  let s=stocks[curStock];if(!s)return;
  let sh=parseInt(document.getElementById('trade-shares').value)||0,amt=sh*s.price;
  if(tradeAction==='buy')document.getElementById('trade-calc').textContent='预计花费: ¥'+amt.toFixed(2)+' | 可用: ¥'+balance.toFixed(2);
  else{let h=holdings[curStock],mx=h?h.shares:0;document.getElementById('trade-calc').textContent='预计收入: ¥'+amt.toFixed(2)+' | 可卖: '+mx+' 股';}
}
function updateTradeInfo(){
  let s=stocks[curStock];if(!s)return;
  let cls=s.change_pct>=0?'up':'down',sg=s.change_pct>=0?'+':'',h=holdings[curStock];
  document.getElementById('trade-info').innerHTML=`
    <div class="tsi-row"><span class="tsi-name">${s.name}</span><span style="font-size:11px;color:var(--sub)">${curStock}</span></div>
    <div class="tsi-row"><span class="tsi-price">${s.price.toFixed(2)}</span><span class="tsi-chg ${cls}">${sg}${s.change.toFixed(2)} (${sg}${s.change_pct.toFixed(2)}%)</span></div>
    <div class="tsi-detail"><span>可用资金</span><span>¥${balance.toFixed(2)}</span><span>持仓</span><span>${h?h.shares:0} 股</span><span>可买</span><span>${Math.floor(balance/s.price)} 股</span></div>`;
  updateTradeCalc();
}
function doTrade(){
  let s=stocks[curStock],sh=parseInt(document.getElementById('trade-shares').value)||0;
  if(sh<=0)return showToast('请输入有效股数','error');
  if(tradeAction==='buy'){
    let cs=s.price*sh;if(balance<cs)return showToast('余额不足！需要 ¥'+cs.toFixed(2),'error');
    balance-=cs;
    if(!holdings[curStock])holdings[curStock]={shares:0,avg_cost:0};
    let h=holdings[curStock],tc=h.shares*h.avg_cost+cs;h.shares+=sh;h.avg_cost=tc/h.shares;
    // 买入推高价格
    s.price=+(s.price*(1+0.0005*sh)).toFixed(2);
    showToast('✅ 买入成功！'+s.name+' '+sh+'股 @ ¥'+s.price.toFixed(2),'success');
  }else{
    if(!holdings[curStock]||holdings[curStock].shares<sh)return showToast('持仓不足！','error');
    balance+=s.price*sh;holdings[curStock].shares-=sh;
    if(holdings[curStock].shares<=0)delete holdings[curStock];
    // 卖出压低价格
    s.price=+(s.price*(1-0.0005*sh)).toFixed(2);
    showToast('✅ 卖出成功！'+s.name+' '+sh+'股 @ ¥'+s.price.toFixed(2),'success');
  }
  save();updateTradeInfo();updatePortfolioPage();updateProfilePage();updateBalance();renderStockScroll();
}

// ==================== 持仓 ====================
function updatePortfolioPage(){
  let tv=balance,mv=0,items=[];
  for(let code in holdings){
    let h=holdings[code];if(h.shares<=0)continue;
    let s=stocks[code];if(!s)continue;
    let mktVal=h.shares*s.price,cost=h.shares*h.avg_cost,profit=mktVal-cost,pct=cost>0?(profit/cost*100):0;
    tv+=mktVal;mv+=mktVal;
    items.push({code,name:s.name,shares:h.shares,avgCost:h.avg_cost,price:s.price,mktVal,profit,pct});
  }
  let tp=tv-900;
  document.getElementById('pv-total').textContent='¥'+tv.toFixed(2);
  document.getElementById('pv-mktval').textContent='¥'+mv.toFixed(2);
  let pe=document.getElementById('pv-profit');
  pe.textContent=(tp>=0?'+':'')+'¥'+tp.toFixed(2);
  pe.className='val '+(tp>=0?'up':'down');
  let list=document.getElementById('position-list');
  if(items.length===0){list.innerHTML='<div class="empty-state"><div class="empty-icon">📭</div><div>暂无持仓</div><div style="font-size:11px;margin-top:4px">去交易页买入股票吧</div></div>';return;}
  let html='';
  items.forEach(item=>{
    let cls=item.profit>=0?'up':'down',sg=item.profit>=0?'+':'';
    html+=`<div class="position-item" onclick="curStock='${item.code}';switchPage('trade');setTimeout(()=>updateTradeInfo(),200)"><div class="pi-header"><div><span class="pi-name">${item.name}</span> <span class="pi-code">${item.code}</span></div><span class="pi-profit ${cls}">${sg}¥${item.profit.toFixed(2)}</span></div><div class="pi-row"><span>持仓 <span>${item.shares}股</span></span><span>成本 <span>¥${item.avgCost.toFixed(2)}</span></span><span>现价 <span>¥${item.price.toFixed(2)}</span></span><span>收益率 <span class="${cls}">${sg}${item.pct.toFixed(2)}%</span></span></div></div>`;
  });
  list.innerHTML=html;
}

// ==================== 我的 ====================
function updateProfilePage(){
  let tv=balance,mv=0,count=0;
  for(let code in holdings){
    let h=holdings[code];if(h.shares<=0)continue;
    let s=stocks[code];if(!s)continue;
    mv+=h.shares*s.price;tv+=h.shares*s.price;count++;
  }
  let profit=tv-900;
  document.getElementById('pf-balance').textContent='¥'+balance.toFixed(2);
  document.getElementById('pf-total').textContent='¥'+tv.toFixed(2);
  document.getElementById('pf-mktval').textContent='¥'+mv.toFixed(2);
  document.getElementById('pf-count').textContent=count;
  let pp=document.getElementById('pf-profit');
  pp.textContent=(profit>=0?'+':'')+'¥'+profit.toFixed(2);
  pp.style.color=profit>=0?'var(--red)':'var(--green)';
}
function updateBalance(){document.getElementById('top-balance').textContent='¥'+balance.toFixed(2);}
function resetAccount(){
  if(!confirm('确定要重置账户吗？所有持仓将被清除，余额恢复为 ¥900。'))return;
  balance=900;holdings={};save();
  updateBalance();updateTradeInfo();updatePortfolioPage();updateProfilePage();showToast('✅ 账户已重置，余额 ¥900.00','success');
}

// ==================== Toast ====================
function showToast(msg,type){
  let t=document.getElementById('toast');
  t.textContent=msg;t.className='toast '+type;t.style.display='block';
  clearTimeout(t._timeout);t._timeout=setTimeout(()=>t.style.display='none',2500);
}

// ==================== 键盘 ====================
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&document.activeElement===document.getElementById('trade-shares'))doTrade();
});

// ==================== 启动 ====================
load();
if(balance===0&&Object.keys(holdings).length===0){balance=900;save();}
for(let code in STOCK_DEF){
  klines[code]=genKlines(code);
  let lc=klines[code][klines[code].length-1].close;
  stocks[code]={name:STOCK_DEF[code].name,price:lc,change:0,change_pct:0};
}
renderStockScroll();renderChart();updateTradeInfo();updatePortfolioPage();updateProfilePage();updateBalance();
window.addEventListener('resize',()=>{if(chart)chart.resize();});
</script>
</body>
</html>
